<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API analytics · Usage Signals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-audience="tenant" data-active="api">
<div class="frame">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <main class="sheet">

      <div class="title-row">
        <div>
          <h1>API analytics</h1>
          <p class="title-sub"><span class="source source-reported">Reported by your services over OTLP</span><span class="stamp" id="stamp"></span></p>
        </div>
        <div class="controls">
          <select class="select" id="service" aria-label="Service" hidden></select>
          <div id="range"></div>
        </div>
      </div>

      <div id="content">
        <section class="headline" aria-label="Headline figures" id="headline"></section>

        <div class="cols">
          <section class="block" aria-labelledby="chart-title">
            <div class="block-head">
              <h2 id="chart-title"></h2>
              <div class="block-tools">
                <div class="legend" id="legend"></div>
                <div class="seg" role="group" aria-label="Chart metric" id="metric">
                  <button type="button" data-metric="requests" aria-pressed="true">Requests</button>
                  <button type="button" data-metric="latency" aria-pressed="false">Latency</button>
                </div>
                <button class="btn btn-quiet btn-small" type="button" id="toggle">View table</button>
              </div>
            </div>
            <div class="chart" id="chart"></div>
            <div class="table-view" id="table" hidden></div>
          </section>

          <section class="field" aria-labelledby="status-title">
            <h2 id="status-title">Status codes</h2>
            <p class="field-caption" id="status-summary" style="margin-top:4px"></p>
            <div class="stack" id="stack-status"></div>
            <div id="table-status"></div>
          </section>
        </div>

        <section class="block" aria-labelledby="routes-title">
          <div class="block-head">
            <h2 id="routes-title">Routes</h2>
            <div class="block-tools" id="routes-info"></div>
          </div>
          <div class="table-wrap" id="table-routes"></div>
        </section>
      </div>
      <div id="empty" hidden></div>

    </main>
  </div>
</div>

<script src="data.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var D = window.LData;
  var META = D.meta();
  var fmt = App.fmt;
  var byId = function (id) { return document.getElementById(id); };
  var project = App.tenant;
  var token = project ? D.tenantToken(project.id) : null;
  var state = { range: 30, service: '', metric: 'requests' };
  var classSeries = [
    { key: '2xx', name: '2xx success', color: 'var(--data-filtered)' },
    { key: '3xx', name: '3xx redirect', color: 'var(--violet-tint)' },
    { key: '4xx', name: '4xx client error', color: 'var(--data-neutral)' },
    { key: '5xx', name: '5xx server error', color: 'var(--data-error)' }
  ];
  var latencySeries = [
    { name: 'p95', color: 'var(--data-filtered)', line: true },
    { name: 'p50', color: 'var(--data-neutral)', line: true, dash: true }
  ];
  var specialRoutes = {
    overflow: 'Series over the cap, counted together',
    unmatched: 'No route template; set http.route to name these'
  };

  function figure(label, value, note) {
    return '<div class="figure"><div class="figure-label">' + label + '</div>' +
      '<div class="figure-value">' + value + '</div><div class="figure-note">' + note + '</div></div>';
  }

  function renderHeadline(result, range) {
    var t = result.totals;
    var prior = result.prior;
    var event = result.incident;
    var bounds = META.histogram_bounds_ms;
    var estimate = '<p>Latency arrives as histogram counts in ' + (bounds.length + 1) + ' buckets, set by ' + bounds.length + ' bounds from ' +
      bounds[0] + ' ms to ' + fmt.int(bounds[bounds.length - 1]) + ' ms.</p><p>A percentile is placed inside its bucket by interpolation, ' +
      'so it is an estimate, not a measured value.</p>';
    var expired = token && token.expired
      ? '<div class="statusline"><span class="pill pill-warning">Token expired ' + fmt.date(token.expires_at) + '</span>' +
        '<span class="muted">Later days are a gap, not zero usage.</span></div>'
      : '';

    byId('headline').innerHTML =
      '<div class="figure hero"><div class="figure-label">' +
      App.info('requests', 'Requests', '<p>Counted from the one histogram your services export, <code>http.server.request.duration</code>.</p>' +
        '<p>Traces and logs are discarded on arrival and never stored.</p>') + '</div>' +
      '<div class="figure-row"><div class="figure-value">' + fmt.int(t.requests) + '</div>' +
      '<div class="figure-note">' + App.delta(t.requests, prior && prior.requests, { range: range, good: 'up' }) + '</div></div>' + expired + '</div>' +

      figure(App.info('errors', 'Server errors (5xx)', '<p><b>' + fmt.int(t.status_classes['5xx']) + '</b> of <b>' + fmt.int(t.requests) + '</b> requests returned a 5xx status.</p>'),
        fmt.pct(t.server_error_rate, 2),
        event ? 'Peaked at ' + fmt.pct(event.rate, 2) + ' on ' + fmt.day(event.day)
          : App.delta(t.server_error_rate, prior && prior.server_error_rate, { range: range, good: 'down', points: true, digits: 2 })) +
      figure(App.info('p50', 'p50 latency, estimate', '<p>Half of requests were at or below this.</p>' + estimate),
        fmt.int(t.p50_ms) + '<small>ms</small>', App.delta(t.p50_ms, prior && prior.p50_ms, { range: range, good: 'down' })) +
      figure(App.info('p95', 'p95 latency, estimate', estimate),
        fmt.int(t.p95_ms) + '<small>ms</small>', App.delta(t.p95_ms, prior && prior.p95_ms, { range: range, good: 'down' }));
  }

  function renderStatus(t) {
    var success = t.status_classes['2xx'] + t.status_classes['3xx'];
    byId('status-summary').textContent = fmt.pct(success / t.requests) + ' of requests succeeded (2xx or 3xx)';
    byId('stack-status').innerHTML = classSeries.map(function (c) {
      var share = t.status_classes[c.key] / t.requests;
      return share ? '<span style="flex:' + share + ' 1 0;background:' + c.color + '" title="' + c.name + ': ' + fmt.int(t.status_classes[c.key]) + '"></span>' : '';
    }).join('');
    byId('table-status').innerHTML = '<table class="data data-compact"><thead><tr><th>Code</th><th class="num">Requests</th><th class="num">Share</th></tr></thead><tbody>' +
      Object.keys(t.status_codes).sort().map(function (code) {
        var series = classSeries.filter(function (c) { return c.key.charAt(0) === code.charAt(0); })[0];
        return '<tr><td><span class="legend-item" title="' + series.name + '">' + Charts.swatch(series) + '<span class="mono">' + code + '</span></span></td>' +
          '<td class="num">' + fmt.int(t.status_codes[code]) + '</td><td class="num">' + fmt.pct(t.status_codes[code] / t.requests, 2) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function renderRoutes(result) {
    var t = result.totals;
    var series = result.series;
    var multi = project.services.length > 1;
    byId('routes-info').innerHTML = '<button class="btn btn-quiet btn-small" type="button" popovertarget="pop-routes">How routes are counted</button>' +
      '<div class="pop" popover id="pop-routes"><h3>How routes are counted</h3><p>Paths are normalized before storage: IDs, account addresses, hashes and UUIDs become placeholders.</p>' +
      '<p>A project may report up to ' + fmt.int(series.cap) + ' distinct series in ' + series.window_days +
      ' days. Anything over the cap is counted under <code>(other)</code>, one row per service.' +
      (series.seen_30d ? ' This project reported <b>' + fmt.int(series.seen_30d) + '</b>.' : '') + '</p>' +
      '<p>Requests whose framework gives no route template are counted under <code>(unmatched)</code> until the service sets <code>http.route</code>.</p></div>';
    byId('table-routes').innerHTML = '<table class="data"><colgroup><col>' + (multi ? '<col style="width:160px">' : '') +
      [150, 110, 110, 110, 120, 120].map(function (w) { return '<col style="width:' + w + 'px">'; }).join('') + '</colgroup><thead>' +
      '<tr><th colspan="' + (multi ? 6 : 5) + '"></th><th class="group" colspan="2">Latency, estimates</th></tr>' +
      '<tr><th>Route</th>' + (multi ? '<th>Service</th>' : '') + '<th class="num">Requests</th><th class="num">Share</th>' +
      '<th class="num">4xx</th><th class="num">5xx</th><th class="num">p50</th><th class="num">p95</th></tr></thead><tbody>' +
      result.routes.map(function (r) {
        var special = specialRoutes[r.kind];
        return '<tr><td><span class="cell-route"><span class="tag method">' + (r.method || '–') + '</span>' +
          '<span><span class="mono">' + App.escapeHtml(r.route) + '</span>' + (special ? '<span class="sub">' + special + '</span>' : '') + '</span></span></td>' +
          (multi ? '<td class="muted">' + App.escapeHtml(r.service) + '</td>' : '') +
          '<td class="num">' + fmt.int(r.requests) + '</td><td class="num muted">' + fmt.pct(r.requests / t.requests) + '</td>' +
          '<td class="num">' + fmt.pct(r.client_error_rate, 2) + '</td><td class="num">' + fmt.pct(r.server_error_rate, 2) + '</td>' +
          '<td class="num">' + fmt.ms(r.p50_ms) + '</td><td class="num">' + fmt.ms(r.p95_ms) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function renderChart(result, range) {
    var daily = result.daily;
    var height = App.plotHeight(600, 240, 340);
    if (state.metric === 'latency') {
      byId('chart-title').textContent = 'Latency per day, estimates';
      latencySeries[0].values = daily.map(function (d) { return d.p95_ms; });
      latencySeries[1].values = daily.map(function (d) { return d.p50_ms; });
      byId('legend').innerHTML = Charts.legend(latencySeries);
      Charts.lines(byId('chart'), {
        label: 'p50 and p95 latency per day, estimated, last ' + range + ' days',
        labels: daily.map(function (d) { return fmt.day(d.day); }), series: latencySeries, height: height,
        format: fmt.ms, tickFormat: fmt.int, emptyText: 'No latency reported in this period.'
      });
      return;
    }
    /* Every day of the range gets a slot, so days without an export read as a gap. */
    var days = D.rangeDays(range);
    var byDay = {};
    daily.forEach(function (d) { byDay[d.day] = d; });
    var lastExport = daily.length ? daily[daily.length - 1].day : null;
    var gapFrom = token && token.expired && lastExport ? days.indexOf(lastExport) + 1 : -1;
    var event = result.incident;
    byId('chart-title').textContent = 'Requests per day';
    byId('legend').innerHTML = '';
    Charts.columns(byId('chart'), {
      label: 'Requests per day, last ' + range + ' days',
      labels: days.map(fmt.day), height: height, format: fmt.int, tickFormat: fmt.tick,
      series: [{ name: 'Requests', color: 'var(--data-filtered)', values: days.map(function (day) { return byDay[day] ? byDay[day].requests : 0; }) }],
      annotations: event ? [{ at: days.indexOf(event.day), label: fmt.day(event.day) + ': ' + fmt.pct(event.rate, 2) + ' server errors' +
        (event.route ? ', mostly ' + event.route : '') }] : [],
      gap: gapFrom > 0 && gapFrom < days.length
        ? { from: gapFrom, to: days.length - 1, label: 'Token expired: a gap, not zero usage', tip: 'No export, token expired' } : null,
      emptyText: 'No requests reported in this period.'
    });
  }

  function renderEmpty(range) {
    var setup = '<a class="btn btn-primary" href="enroll.html' + App.projectQuery + '">Open Setup</a>';
    byId('empty').innerHTML = token && token.expired
      ? App.emptyState('No API telemetry in the last ' + range + ' days',
        'The ingest token expired on ' + fmt.date(token.expires_at) + ', so exports are refused. This is a gap, not zero usage.', setup)
      : App.emptyState('No API telemetry in the last ' + range + ' days',
        'API telemetry is optional. Setup shows how to export it from a Collector or an SDK.', setup);
  }

  function render() {
    var range = state.range;
    byId('stamp').textContent = App.stamp();
    if (!project) {
      byId('content').hidden = true;
      byId('empty').hidden = false;
      byId('empty').innerHTML = App.emptyState('No project', 'No project is enrolled yet.');
      return;
    }
    var result = D.api(project.id, range, state.service);
    byId('content').hidden = !result.totals;
    byId('empty').hidden = Boolean(result.totals);
    if (!result.totals) { renderEmpty(range); return; }

    renderHeadline(result, range);
    renderStatus(result.totals);
    renderRoutes(result);
    renderChart(result, range);
    App.dataTable(byId('table'), ['Day', 'Requests', '4xx', '5xx', 'p50 est.', 'p95 est.'], result.daily.slice().reverse().map(function (d) {
      return [fmt.date(d.day), fmt.int(d.requests), fmt.pct(d.client_error_rate, 2), fmt.pct(d.server_error_rate, 2), fmt.ms(d.p50_ms), fmt.ms(d.p95_ms)];
    }));
  }

  document.addEventListener('DOMContentLoaded', function () {
    var select = byId('service');
    var services = project ? project.services : [];
    select.innerHTML = '<option value="">All services</option>' + services.map(function (s) {
      return '<option value="' + App.escapeHtml(s) + '">' + App.escapeHtml(s) + '</option>';
    }).join('');
    select.hidden = services.length < 2;
    select.addEventListener('change', function () { state.service = select.value; render(); });
    byId('metric').addEventListener('click', function (event) {
      var button = event.target.closest('button');
      if (!button) return;
      state.metric = button.dataset.metric;
      Array.prototype.forEach.call(byId('metric').children, function (b) { b.setAttribute('aria-pressed', String(b === button)); });
      render();
    });
    App.viewToggle(byId('toggle'), byId('chart'), byId('table'));
    App.rangeControl(byId('range'), function (range) { state.range = range; render(); });
  });
})();
</script>
</body>
</html>
