# Isolated stack for check 04, round two. Same pinned images as docker-compose.yml.
# Credentials are local-only values, not secrets. No fixed host port: Docker picks a free one
# and the script reads it back, so parallel checks on one machine cannot collide.
services:
  postgres:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc-local-only
      POSTGRES_DB: poc
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 2s
      timeout: 3s
      retries: 30

  umami:
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://poc:poc-local-only@postgres:5432/poc
      APP_SECRET: local-only-umami-app-secret
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1::3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  pgdata:
