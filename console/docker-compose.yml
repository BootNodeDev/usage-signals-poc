# Local stack only. Credentials below are local development values, not secrets.
# Umami keeps its tables in schema "public"; ours live in schema "usage_signals" (db/schema.sql).
name: usage-signals-poc

services:
  postgres:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc-local-only
      POSTGRES_DB: poc
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 2s
      timeout: 3s
      retries: 30

  umami:
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://poc:poc-local-only@postgres:5432/poc
      APP_SECRET: local-only-umami-app-secret
      DISABLE_TELEMETRY: "1"
      DISABLE_BOT_CHECK: "1"
    ports:
      - "127.0.0.1:3301:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s

  # The same Umami without its GeoLite2 file, which is how it runs on Vercel
  # (scripts/build-geo.js skips the download there). Used by the tests only.
  umami-nogeo:
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    depends_on:
      umami:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://poc:poc-local-only@postgres:5432/poc
      APP_SECRET: local-only-umami-app-secret
      DISABLE_TELEMETRY: "1"
      DISABLE_BOT_CHECK: "1"
      GEOLITE_DB_PATH: /nonexistent/GeoLite2-City.mmdb
    ports:
      - "127.0.0.1:3302:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  pgdata:
