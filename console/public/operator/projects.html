<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Operator · Pulse</title>
<link rel="preload" href="/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body data-audience="operator" data-active="projects">
<div class="frame">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <main class="sheet">

      <div class="view" id="view-list">
        <div class="title-row">
          <div>
            <h1>Projects</h1>
            <p class="title-sub"><span class="source">Observed by the tracker</span><span class="stamp" id="stamp"></span></p>
          </div>
          <div class="controls" id="controls"><div id="range"></div></div>
        </div>

        <div class="toolbar">
          <input class="input" id="search" type="search" placeholder="Search project or domain" aria-label="Search project or domain">
          <select class="select" id="state-filter" aria-label="State"></select>
          <span class="spacer"></span>
          <button class="btn" type="button" id="compare-toggle" aria-pressed="false">Compare</button>
        </div>

        <div id="list-message" hidden></div>
        <div class="table-wrap"><table class="data rows" id="projects"></table></div>
        <p class="caption" id="caption"></p>
      </div>

      <div class="view" id="view-compare" hidden>
        <button class="back" type="button" id="compare-back"></button>
        <div class="title-row">
          <div>
            <h1>Compare</h1>
            <p class="title-sub" id="compare-summary"></p>
          </div>
          <div class="controls" id="compare-controls"><button class="btn" type="button" id="compare-csv">Download CSV</button></div>
        </div>
        <div id="compare"></div>
      </div>

    </main>
  </div>
</div>

<div class="tray" id="tray" aria-hidden="true">
  <span id="tray-text" aria-live="polite"></span>
  <span id="tray-picked" class="flags"></span>
  <span class="spacer"></span>
  <button class="btn btn-quiet" type="button" id="tray-cancel">Cancel</button>
  <button class="btn btn-primary" type="button" id="tray-open">Compare</button>
</div>

<dialog class="drawer" id="drawer" aria-labelledby="drawer-title"></dialog>

<script src="/data.js"></script>
<script src="/charts.js"></script>
<script>
(function () {
  'use strict';
  var D = window.LData;
  var byId = function (id) { return document.getElementById(id); };

  function start() {
    var App = window.App;
    var fmt = App.fmt;
    var esc = App.escapeHtml;
    var MAX_COMPARED = 3;
    var STATE_FILTERS = [['', 'All states'], ['pending_verification', 'Pending verification'], ['pending_approval', 'Pending approval'],
      ['active', 'Active'], ['unverified', 'Unverified'], ['suspended', 'Suspended']];
    var BREAKDOWNS = {
      referrers: ['Referrers', 'Visitors in the period by referring host'],
      countries: ['Countries', 'Visitors in the period by country'],
      devices: ['Devices', 'Visitors in the period by device class'],
      browsers: ['Browsers', 'Visitors in the period by browser']
    };
    var columns = [
      { key: 'pageviews', label: 'Page views', value: function (r) { return r.totals.pageviews; } },
      { key: 'visitors', label: 'Visitors (sum of daily)', value: function (r) { return r.totals.visitors; } },
      { key: 'visits', label: 'Visits', value: function (r) { return r.totals.visits; } },
      { key: 'bounce', label: 'Bounce rate', value: function (r) { return r.totals.bounce_rate; } },
      { key: 'duration', label: 'Visit duration', value: function (r) { return r.totals.avg_visit_seconds; } }
    ];
    var state = { range: 30, search: '', stateFilter: '', sort: 'pageviews', descending: true,
      comparing: false, compared: [], view: 'list', open: null, drawerTab: 'referrers', compareTab: 'referrers' };
    var all = [];
    var loaded = false;
    var opener = null;

    function find(id) { return all.filter(function (r) { return r.project.id === id; })[0] || null; }
    function hasData(r) { return r.totals.pageviews !== 0 || r.totals.flagged !== 0; }
    function isSmall(value) { return Boolean(value && value.small); }
    /* A count as text: exact, or "<10" when the API only says it is small. */
    function countText(value) { return isSmall(value) ? '<' + value.below : value; }
    function count(value) {
      return isSmall(value)
        ? '<span class="muted" title="More than zero and fewer than ' + value.below + '. The exact number is not shown.">' + esc(countText(value)) + '</span>'
        : fmt.int(value);
    }
    /* A rate as text; it is withheld when it rests on a small number of visits. */
    function rateText(value, format) {
      if (value === null) return '';
      return isSmall(value) ? 'Too few visits' : format(value);
    }
    function rate(value, format) {
      if (value === null) return App.dash();
      return isSmall(value) ? '<span class="muted" title="Not shown for fewer than ' + value.below + ' visits">' + rateText(value, format) + '</span>' : format(value);
    }
    /* For drawing only: a small count has no height, and the chart says so. */
    function drawn(value) { return isSmall(value) ? 0 : value; }
    function hasSmallDay(r) { return r.daily.some(function (d) { return isSmall(d.pageviews) || isSmall(d.flagged); }); }
    function chartNote(r) {
      return hasSmallDay(r) ? '<p class="caption">Counts under ' + D.meta().small_counts.below + ' are not drawn.</p>' : '';
    }
    function chartCount(value) { return value === null ? '<' + D.meta().small_counts.below : fmt.int(value); }
    /* A small count is null in the chart: not drawn, "<10" in the tip, and no raw total for its day. */
    function dailyChart(el, r, height, max) {
      var exact = function (value) { return isSmall(value) ? null : value; };
      Charts.columns(el, {
        label: r.project.name + ': page views per day, counted and flagged', labels: r.daily.map(function (d) { return fmt.day(d.day); }),
        height: height, max: max, format: chartCount, tickFormat: fmt.tick, totalName: 'Raw',
        series: [
          { name: 'Counted', color: 'var(--data-filtered)', values: r.daily.map(function (d) { return exact(d.pageviews); }) },
          { name: 'Flagged', color: 'var(--data-flagged)', hatch: true, values: r.daily.map(function (d) { return exact(d.flagged); }) }
        ]
      });
    }
    /* The flagged share of raw page views needs both exact counts; otherwise only the flagged count is shown. */
    function flaggedShare(t) {
      if (isSmall(t.pageviews) || isSmall(t.flagged) || !(t.pageviews + t.flagged)) return count(t.flagged);
      return '<span class="cell-trust">' + App.qualityBar(t.pageviews, t.flagged) + '<span>' + fmt.pct(t.flagged / (t.pageviews + t.flagged)) + '</span></span>';
    }

    function visible() {
      var needle = state.search.trim().toLowerCase();
      return all.filter(function (r) {
        var p = r.project;
        if (needle && (p.name + ' ' + p.domain).toLowerCase().indexOf(needle) < 0) return false;
        return !state.stateFilter || p.state === state.stateFilter;
      });
    }

    function sorted(list) {
      var column = columns.filter(function (c) { return c.key === state.sort; })[0] || columns[0];
      return D.sortRows(list, column.value, state.descending);
    }

    function listMessage(title, text, action) {
      byId('list-message').hidden = !title;
      byId('projects').hidden = Boolean(title);
      byId('list-message').innerHTML = title ? App.emptyState(title, text, action) : '';
    }

    function renderTable() {
      if (!loaded) return;
      var list = sorted(visible());
      var head = '<thead><tr>' + (state.comparing ? '<th class="col-check"><span class="sr-only">Select</span></th>' : '') +
        '<th>Project</th><th>State</th>' + columns.map(function (c, index) {
          var sort = state.sort === c.key ? ' aria-sort="' + (state.descending ? 'descending' : 'ascending') + '"' : '';
          return '<th class="num"' + sort + '><button type="button" data-sort="' + c.key + '">' + c.label + '</button></th>' +
            (index === 0 ? '<th>Flagged</th>' : '');
        }).join('') + '</tr></thead>';
      var body = list.map(function (r) {
        var p = r.project;
        var t = r.totals;
        var picked = state.compared.indexOf(p.id) >= 0;
        var full = state.compared.length >= MAX_COMPARED && !picked;
        var check = state.comparing
          ? '<td class="col-check"><input type="checkbox" data-compare="' + p.id + '"' + (picked ? ' checked' : '') + (!hasData(r) || full ? ' disabled' : '') +
            ' aria-label="Compare ' + esc(p.name) + '"' + (!hasData(r) ? ' title="No web data to compare"' : '') + '></td>'
          : '';
        return '<tr data-id="' + p.id + '"' + (state.open === p.id || (state.comparing && picked) ? ' class="is-open"' : '') + '>' + check +
          '<td><button class="row-open" type="button" data-open="' + p.id + '">' + App.projectName(p) + '</button><span class="sub">' + esc(p.domain) + '</span></td>' +
          '<td>' + App.statePill(p.state) + '</td>' +
          '<td class="num"><span class="cell-trend">' + Charts.spark(r.daily.map(function (d) { return drawn(d.pageviews); }), 'Page views per day, last ' + state.range + ' days') +
          count(t.pageviews) + '</span></td>' +
          '<td>' + flaggedShare(t) + '</td>' +
          '<td class="num">' + count(t.visitors) + '</td><td class="num">' + count(t.visits) + '</td>' +
          '<td class="num">' + rate(t.bounce_rate, fmt.pct) + '</td><td class="num">' + rate(t.avg_visit_seconds, fmt.duration) + '</td></tr>';
      }).join('');
      if (!list.length) body = '<tr><td colspan="9" class="muted">No project matches this search.</td></tr>';
      byId('projects').innerHTML = head + '<tbody>' + body + '</tbody>';
      var below = D.meta().small_counts.below;
      byId('caption').textContent = list.length + ' of ' + all.length + ' projects · Aggregates only. Counts of 1 to ' + (below - 1) +
        ' show as <' + below + ' and rates need ' + below + ' visits, a placeholder threshold. Three flag rules in this prototype.';
    }

    function renderTray() {
      var picked = state.compared.map(find).filter(Boolean);
      byId('tray').setAttribute('aria-hidden', String(!(state.comparing && state.view === 'list')));
      byId('tray-text').textContent = picked.length ? picked.length + ' of ' + MAX_COMPARED + ' selected' : 'Select two or three projects to compare';
      byId('tray-picked').innerHTML = picked.map(function (r) { return '<span class="pill">' + esc(r.project.name) + '</span>'; }).join('');
      byId('tray-open').disabled = picked.length < 2;
      byId('compare-toggle').setAttribute('aria-pressed', String(state.comparing));
    }

    /* Top five rows with their counts. Shares are not shown: with small counts hidden they cannot be computed honestly. */
    function valueRows(rows) {
      if (!rows || !rows.length) return App.empty('No data in this period.');
      var list = rows.slice(0, 5);
      var max = Math.max.apply(null, list.map(function (r) { return drawn(r.value); }));
      return list.map(function (r) {
        return '<div class="bar-row is-share"><span class="bar-label">' + esc(r.label) + '</span>' +
          '<span class="bar-value">' + count(r.value) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + (max ? drawn(r.value) / max * 100 : 0) + '%"></span></span></div>';
      }).join('');
    }

    function renderCompareBreakdown(picked) {
      byId('compare-breakdown-label').textContent = BREAKDOWNS[state.compareTab][1];
      picked.forEach(function (r, i) { byId('compare-breakdown-' + i).innerHTML = '<div class="bars">' + valueRows(r.breakdowns[state.compareTab]) + '</div>'; });
    }

    function comparedRows() {
      return state.compared.map(find).filter(function (r) { return r && hasData(r); });
    }

    function downloadCompare() {
      var percent = function (value) { return parseFloat(fmt.pct(value)); };
      var picked = comparedRows();
      var days = picked[0].daily;
      App.downloadCsv('compare-' + days[0].day + '-to-' + days[days.length - 1].day + '.csv',
        ['Project', 'Domain', 'Page views', 'Visitors (sum of daily)', 'Visits', 'Bounce rate (%)', 'Visit duration (s)'],
        picked.map(function (r) {
          var t = r.totals;
          return [r.project.name, r.project.domain, countText(t.pageviews), countText(t.visitors), countText(t.visits),
            rateText(t.bounce_rate, percent), rateText(t.avg_visit_seconds, Math.round)];
        }));
    }

    function renderCompare() {
      var picked = comparedRows();
      byId('compare-back').innerHTML = App.icon('back') + 'Projects';
      byId('compare-csv').hidden = picked.length < 2;
      if (picked.length < 2) {
        byId('compare-summary').textContent = 'Same metrics, same period, same scale';
        byId('compare').innerHTML = App.emptyState('Nothing to compare yet', 'Select two or three projects with web data in the projects list.');
        return;
      }
      byId('compare-summary').textContent = picked.length + ' projects, last ' + state.range + ' days, one scale';
      var cells = function (label, cell, bar, first) {
        var max = bar ? Math.max.apply(null, picked.map(function (r) { return drawn(bar(r)); })) : 0;
        return '<div class="compare-label' + (first ? ' compare-first' : '') + '">' + label + '</div>' + picked.map(function (r) {
          var track = bar && max ? '<span class="bar-track"><span class="bar-fill" style="width:' + (drawn(bar(r)) / max * 100) + '%"></span></span>' : '';
          return '<div' + (first ? ' class="compare-first"' : '') + '>' + cell(r) + track + '</div>';
        }).join('');
      };
      byId('compare').innerHTML = '<div class="compare" style="grid-template-columns:200px repeat(' + picked.length + ', minmax(0, 1fr))">' +
        '<div class="compare-head"></div>' + picked.map(function (r) {
          return '<div class="compare-head"><button class="row-open" type="button" data-open="' + r.project.id + '">' + App.projectName(r.project) + '</button></div>';
        }).join('') +
        '<div class="compare-chart compare-label">Page views per day</div>' + picked.map(function (r, i) {
          return '<div class="compare-chart"><div class="chart" id="multiple-' + i + '"></div>' + chartNote(r) + '</div>';
        }).join('') +
        '<div class="compare-group">Web <span class="source">Observed by the tracker</span></div>' +
        cells('Page views', function (r) { return '<b>' + count(r.totals.pageviews) + '</b>'; }, function (r) { return r.totals.pageviews; }, true) +
        cells('Flagged share', function (r) { return flaggedShare(r.totals); }) +
        cells('Visitors (sum of daily)', function (r) { return count(r.totals.visitors); }, function (r) { return r.totals.visitors; }) +
        cells('Visits', function (r) { return count(r.totals.visits); }, function (r) { return r.totals.visits; }) +
        cells('Bounce rate', function (r) { return rate(r.totals.bounce_rate, fmt.pct); }) +
        cells('Visit duration', function (r) { return rate(r.totals.avg_visit_seconds, fmt.duration); }) +
        '<div class="compare-tabs"><div class="tabs" role="tablist" aria-label="Breakdown" id="compare-tabs">' +
        Object.keys(BREAKDOWNS).map(function (key) {
          return '<button type="button" role="tab" data-tab="' + key + '" aria-selected="' + (key === state.compareTab) + '">' + BREAKDOWNS[key][0] + '</button>';
        }).join('') + '</div></div>' +
        '<div class="compare-label compare-first" id="compare-breakdown-label"></div>' + picked.map(function (r, i) {
          return '<div class="compare-first" id="compare-breakdown-' + i + '"></div>';
        }).join('') + '</div>';
      App.tabs(byId('compare-tabs'), function (tab) { state.compareTab = tab; renderCompareBreakdown(picked); });
      renderCompareBreakdown(picked);
      var max = Math.max.apply(null, picked.map(function (r) {
        return Math.max.apply(null, r.daily.map(function (d) { return drawn(d.pageviews) + drawn(d.flagged); }).concat([0]));
      }));
      picked.forEach(function (r, i) { dailyChart(byId('multiple-' + i), r, 180, max); });
    }

    function showView(view) {
      state.view = view;
      byId('view-list').hidden = view !== 'list';
      byId('view-compare').hidden = view !== 'compare';
      (view === 'compare' ? byId('compare-controls') : byId('view-list').querySelector('.title-row')).appendChild(byId('controls'));
      renderTray();
      if (view === 'compare') renderCompare(); else renderTable();
      window.scrollTo(0, 0);
    }

    function kv(pairs) {
      return '<dl class="kv">' + pairs.map(function (pair) { return '<dt>' + pair[0] + '</dt><dd>' + pair[1] + '</dd>'; }).join('') + '</dl>';
    }

    function openDrawer(id, from) {
      var r = find(id);
      if (!r) return;
      var p = r.project;
      var t = r.totals;
      var drawer = byId('drawer');
      opener = from || document.querySelector('tr[data-id="' + id + '"] .row-open');
      state.open = id;
      var web = hasData(r)
        ? '<div class="drawer-hero"><b>' + count(t.pageviews) + '</b><span class="muted">page views, ' + count(t.flagged) + ' flagged</span></div>' +
          '<div class="chart" id="drawer-chart" style="margin-top:16px"></div>' + chartNote(r) + '</section>' +
          '<section class="drawer-section"><h3>Flagged page views by rule</h3>' + kv(r.byRule.map(function (rule) { return [esc(rule.label), count(rule.value)]; })) + '</section>' +
          '<section class="drawer-section">' + kv([
            ['Visitors (sum of daily)', count(t.visitors)], ['Visits', count(t.visits)],
            ['Bounce rate', rate(t.bounce_rate, fmt.pct)], ['Visit duration', rate(t.avg_visit_seconds, fmt.duration)]
          ]) + '</section>' +
          '<section class="drawer-section"><div class="tabs" role="tablist" aria-label="Breakdown" id="drawer-tabs">' +
          Object.keys(BREAKDOWNS).map(function (key) {
            return '<button type="button" role="tab" data-tab="' + key + '" aria-selected="' + (key === state.drawerTab) + '" aria-controls="drawer-breakdown">' + BREAKDOWNS[key][0] + '</button>';
          }).join('') + '</div><div class="bars" id="drawer-breakdown" role="tabpanel"></div>'
        : App.empty('No page views in the last ' + state.range + ' days.');
      drawer.innerHTML =
        '<div class="drawer-head"><div><h2 id="drawer-title">' + App.projectName(p) + '</h2>' +
        '<p><span>' + esc(p.domain) + '</span>' + App.statePill(p.state) + '<span>Last ' + state.range + ' days</span></p></div>' +
        '<button class="icon-btn" type="button" id="drawer-close" aria-label="Close details">' + App.icon('close') + '</button></div>' +
        '<div class="drawer-body"><section class="drawer-section"><h3>Web <span class="source">Observed by the tracker</span></h3>' + web + '</section>' +
        '<section class="drawer-section"><h3>API <span class="source source-reported">Reported by the project</span></h3>' +
        '<p class="muted">No API metrics received. API ingestion is the next step of this prototype.</p></section></div>' +
        '<div class="drawer-foot"><span class="muted">Approve, suspend and remove: ' + App.NOT_IN_PROTOTYPE.toLowerCase() + '.</span></div>';
      if (!drawer.open) drawer.showModal();
      byId('drawer-close').addEventListener('click', function () { drawer.close(); });
      if (hasData(r)) {
        dailyChart(byId('drawer-chart'), r, 200);
        var paintBreakdown = function () { byId('drawer-breakdown').innerHTML = valueRows(r.breakdowns[state.drawerTab]); };
        App.tabs(byId('drawer-tabs'), function (tab) { state.drawerTab = tab; paintBreakdown(); });
        paintBreakdown();
      }
    }

    function paint() {
      byId('stamp').textContent = App.stamp();
      state.compared = state.compared.filter(function (id) { var r = find(id); return r && hasData(r); });
      if (!all.length) { listMessage('No project is registered', 'Projects appear here once they are seeded.'); byId('caption').textContent = ''; return; }
      listMessage('');
      renderTray();
      if (state.view === 'compare') renderCompare(); else renderTable();
      if (byId('drawer').open && state.open) openDrawer(state.open, opener);
    }

    function render(range) {
      state.range = range;
      if (!loaded) listMessage('Loading figures', 'Reading the last ' + range + ' days for every project.');
      D.loadOperator(range).then(function (rows) {
        if (state.range !== range) return;
        loaded = true;
        all = rows;
        paint();
      }, function (error) {
        if (state.range !== range) return;
        loaded = false;
        byId('caption').textContent = '';
        listMessage('Figures are unavailable', esc(error.message || 'The figures could not be read.') + ' Nothing is shown in their place.',
          '<button class="btn btn-primary" type="button" id="retry">Try again</button>');
        byId('retry').addEventListener('click', function () { render(range); });
      });
    }

    byId('state-filter').innerHTML = STATE_FILTERS.map(function (f) { return '<option value="' + f[0] + '">' + f[1] + '</option>'; }).join('');
    byId('search').addEventListener('input', function (event) { state.search = event.target.value; renderTable(); });
    byId('state-filter').addEventListener('change', function (event) { state.stateFilter = event.target.value; renderTable(); });
    byId('projects').addEventListener('click', function (event) {
      var sort = event.target.closest('[data-sort]');
      var open = event.target.closest('[data-open]');
      if (sort) {
        state.descending = state.sort === sort.dataset.sort ? !state.descending : true;
        state.sort = sort.dataset.sort;
        renderTable();
      } else if (open) {
        openDrawer(open.dataset.open, open);
      }
    });
    byId('projects').addEventListener('change', function (event) {
      var id = event.target.dataset.compare;
      if (!id) return;
      state.compared = event.target.checked ? state.compared.concat([id]) : state.compared.filter(function (other) { return other !== id; });
      renderTray();
      renderTable();
    });
    byId('compare').addEventListener('click', function (event) {
      var open = event.target.closest('[data-open]');
      if (open) openDrawer(open.dataset.open, open);
    });
    byId('compare-toggle').addEventListener('click', function () { state.comparing = !state.comparing; if (!state.comparing) state.compared = []; renderTray(); renderTable(); });
    byId('tray-cancel').addEventListener('click', function () { state.comparing = false; state.compared = []; renderTray(); renderTable(); });
    byId('tray-open').addEventListener('click', function () { showView('compare'); });
    byId('compare-back').addEventListener('click', function () { showView('list'); });
    byId('compare-csv').addEventListener('click', downloadCompare);
    byId('drawer').addEventListener('close', function () { state.open = null; if (opener && opener.focus) opener.focus(); if (state.view === 'list') renderTable(); });
    App.rangeControl(byId('range'), render);
  }

  D.boot(start);
})();
</script>
</body>
</html>
