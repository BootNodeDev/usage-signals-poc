<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access · Operator · Pulse</title>
<link rel="preload" href="/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script>
  window.va = window.va || function () { window.vaq = window.vaq || []; window.vaq.push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body data-audience="operator" data-active="access">
<div class="frame">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <main class="sheet">
      <div class="title-row">
        <div>
          <h1>Access</h1>
          <p class="title-sub">Who can use the operator console and the metrics API</p>
        </div>
      </div>
      <div id="content"></div>
    </main>
  </div>
</div>

<script type="module" src="/data.js"></script>
<script type="module">
  var D = window.LData;
  var content = document.getElementById('content');

  function message(title, text, action) {
    content.innerHTML = '<div class="empty-state"><h2>' + title + '</h2><p>' + text + '</p>' + (action || '') + '</div>';
  }

  var SECTIONS = [
    ['Operators', 'Planned: sign-in with an allowlisted account and a one-time code. Today anyone with this address can open this console.'],
    ['Metrics API keys', 'Planned, with the metrics API.'],
    ['Enrollment mode', 'Projects cannot enroll yet. The ones listed were created at deploy time.'],
    ['Audit log', 'Operators can take no action yet, so there is nothing to log.']
  ];

  function start() {
    content.innerHTML = SECTIONS.map((section) => '<section class="block"><div class="block-head"><h2>' + section[0] + '</h2><span class="pill">' + window.App.NOT_IN_PROTOTYPE + '</span></div>' +
        '<p class="muted">' + section[1] + '</p></section>').join('');
  }

  message('Loading', '');
  D.boot(start);
</script>
</body>
</html>
