# Isolated stack for round two of check 03. Same pinned images as compose.yml.
# Credentials are local values, not secrets. No fixed host ports: the script asks Docker
# which port each Umami instance received.
name: us-check-03-r2

x-umami: &umami
  image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 20s
  ports:
    - "127.0.0.1::3000"

services:
  postgres:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc-local-only
      POSTGRES_DB: poc
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Location A. Starts first and creates Umami's tables. Never changes during the run.
  umami-a:
    <<: *umami
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://poc:poc-local-only@postgres:5432/poc
      DISABLE_TELEMETRY: "1"
      APP_SECRET: check-03-shared-app-secret
      ENABLE_CLIENT_SALT: "1"
      SALT_ROTATION: monthly
      TZ: UTC

  # Location B. The defaults equal location A. round-two.mjs recreates this service with one
  # variable changed at a time to produce each drift.
  umami-b:
    <<: *umami
    depends_on:
      umami-a:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://poc:poc-local-only@postgres:5432/poc
      DISABLE_TELEMETRY: "1"
      APP_SECRET: ${CHECK_B_APP_SECRET:-check-03-shared-app-secret}
      ENABLE_CLIENT_SALT: ${CHECK_B_ENABLE_CLIENT_SALT-1}
      SALT_ROTATION: ${CHECK_B_SALT_ROTATION:-monthly}
      TZ: ${CHECK_B_TZ:-UTC}

volumes:
  pgdata:
