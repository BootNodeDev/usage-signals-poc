<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Operator · Usage Signals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-audience="operator" data-active="projects">
<div class="frame">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <main class="sheet">

      <div class="view" id="view-list">
        <div class="title-row">
          <div>
            <h1>Projects</h1>
            <p class="title-sub" id="finding"></p>
          </div>
          <div class="controls" id="controls">
            <span class="stamp" id="stamp"></span>
            <div id="range"></div>
          </div>
        </div>

        <div class="toolbar">
          <input class="input" id="search" type="search" placeholder="Search project or domain" aria-label="Search project or domain">
          <select class="select" id="state-filter" aria-label="State"></select>
          <button class="btn" type="button" id="filters-button" popovertarget="pop-filters">Filters</button>
          <div class="pop pop-menu" popover id="pop-filters">
            <div class="menu-item">
              <input type="checkbox" id="f-flagged">
              <label for="f-flagged">Flagged share over</label>
              <input type="number" id="threshold" min="0" max="100" step="1" value="10" aria-label="Flagged share threshold, percent"><span>%</span>
            </div>
            <div class="menu-item">
              <input type="checkbox" id="f-api">
              <label for="f-api">Reports API traffic</label>
            </div>
            <div class="menu-sep"></div>
            <button class="menu-item" type="button" id="f-clear">Clear filters</button>
          </div>
          <span class="spacer"></span>
          <span class="source muted" id="source"></span>
          <div class="seg" role="group" aria-label="Table view" id="mode">
            <button type="button" data-mode="web" aria-pressed="true">Web</button>
            <button type="button" data-mode="api" aria-pressed="false">API</button>
          </div>
          <button class="btn" type="button" id="compare-toggle" aria-pressed="false">Compare</button>
        </div>

        <div class="table-wrap"><table class="data rows" id="projects"></table></div>
        <p class="caption" id="caption"></p>
      </div>

      <div class="view" id="view-compare" hidden>
        <button class="back" type="button" id="compare-back"></button>
        <div class="title-row">
          <div>
            <h1>Compare</h1>
            <p class="title-sub" id="compare-summary"></p>
          </div>
          <div class="controls" id="compare-controls"></div>
        </div>
        <div id="compare"></div>
      </div>

    </main>
  </div>
</div>

<div class="tray" id="tray" aria-hidden="true">
  <span id="tray-text" aria-live="polite"></span>
  <span id="tray-picked" class="flags"></span>
  <span class="spacer"></span>
  <button class="btn btn-quiet" type="button" id="tray-cancel">Cancel</button>
  <button class="btn btn-primary" type="button" id="tray-open">Compare</button>
</div>

<dialog class="drawer" id="drawer" aria-labelledby="drawer-title"></dialog>

<script src="data.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var D = window.LData;
  var META = D.meta();
  var fmt = App.fmt;
  var esc = App.escapeHtml;
  var dash = App.dash;
  var byId = function (id) { return document.getElementById(id); };
  var MAX_COMPARED = 3;
  var webRules = D.flagRules();
  var apiRules = D.apiFlagRules();
  var STATE_FILTERS = [['', 'All states'], ['pending_verification', 'Pending verification'], ['pending_approval', 'Pending approval'],
    ['active', 'Active'], ['unverified', 'Unverified'], ['suspended', 'Suspended'], ['removed', 'Removed']];
  var PROOF_METHODS = { page: 'snippet or meta tag on the page', dns_txt: 'DNS TXT record', stellar_toml: 'stellar.toml' };
  var EVIDENCE_STATUS = { checked: 'checked automatically', to_review: 'to review', unconfirmed: 'unconfirmed', confirmed: 'confirmed' };
  var BREAKDOWNS = {
    referrers: ['Referrers', 'Share of visits by referring host'],
    countries: ['Countries', 'Share of visitors (sum of daily) by country'],
    devices: ['Devices', 'Share of visitors (sum of daily) by device class'],
    browsers: ['Browsers', 'Share of visitors (sum of daily) by browser']
  };
  var REMOVE_NOTE = 'Removing revokes its ingest tokens and keys, blocks the domain and the account from enrolling again, ' +
    'and deletes its data after a short grace period.';
  var series = [
    { name: 'Filtered', color: 'var(--data-filtered)' },
    { name: 'Flagged', color: 'var(--data-flagged)', hatch: true }
  ];
  var classSeries = [
    { key: '2xx', name: '2xx', color: 'var(--data-filtered)' },
    { key: '3xx', name: '3xx', color: 'var(--violet-tint)' },
    { key: '4xx', name: '4xx', color: 'var(--data-neutral)' },
    { key: '5xx', name: '5xx', color: 'var(--data-error)' }
  ];

  var state = {
    range: 30, search: '', stateFilter: '', flagged: false, api: false, threshold: 10,
    mode: 'web', sort: 'pageviews', descending: true,
    comparing: false, compared: [], view: 'list', open: null, drawerTab: 'referrers', compareTab: 'referrers'
  };
  (function restore() {
    try {
      var saved = JSON.parse(App.store.get('operator') || '{}');
      ['mode', 'comparing', 'compared', 'view'].forEach(function (key) { if (saved[key] !== undefined) state[key] = saved[key]; });
    } catch (error) { /* a stale value is ignored */ }
    if (!Array.isArray(state.compared)) state.compared = [];
    if (state.mode !== 'api') state.mode = 'web';
  })();
  function persist() {
    App.store.set('operator', JSON.stringify({ mode: state.mode, comparing: state.comparing, compared: state.compared, view: state.view }));
  }

  var all = [];
  var opener = null;

  var columns = {
    web: [
      { key: 'pageviews', label: 'Page views, filtered', num: true, value: function (r) { return r.web && r.web.pageviews_filtered; } },
      { key: 'flagged', label: 'Flagged', value: function (r) { return r.web && r.web.flagged_share; } },
      { key: 'visitors', label: 'Visitors (sum of daily)', num: true, value: function (r) { return r.web && r.web.visitors_filtered; } },
      { key: 'requests', label: 'API requests', num: true, value: function (r) { return r.api && r.api.requests; } }
    ],
    api: [
      { key: 'requests', label: 'Requests', num: true, value: function (r) { return r.api && r.api.requests; } },
      { key: 'errors', label: 'Server errors (5xx)', num: true, value: function (r) { return r.api && r.api.server_error_rate; } },
      { key: 'p95', label: 'p95 latency, estimate', num: true, value: function (r) { return r.api && r.api.p95_ms; } },
      { key: 'apiflags', label: 'Plausibility', value: function (r) { return r.api ? r.project.api_flags.length : null; } }
    ]
  };

  function overThreshold(web) { return web && web.flagged_share * 100 > state.threshold; }
  function exact(value, text) { return '<span title="' + fmt.int(value) + '">' + text + '</span>'; }
  function find(id) { return all.filter(function (r) { return r.project.id === id; })[0] || null; }

  function visible() {
    var needle = state.search.trim().toLowerCase();
    return all.filter(function (r) {
      var p = r.project;
      if (needle && (p.name + ' ' + p.domain).toLowerCase().indexOf(needle) < 0) return false;
      if (state.stateFilter && p.state !== state.stateFilter) return false;
      if (state.api && !r.api) return false;
      if (state.flagged && !overThreshold(r.web)) return false;
      return true;
    });
  }

  function sorted(list) {
    var column = columns[state.mode].filter(function (c) { return c.key === state.sort; })[0] || columns[state.mode][0];
    return list.slice().sort(function (a, b) {
      var x = column.value(a);
      var y = column.value(b);
      if (x === null || x === undefined) return 1;
      if (y === null || y === undefined) return -1;
      var order = x < y ? -1 : x > y ? 1 : 0;
      return state.descending ? -order : order;
    });
  }

  /* ---------- overview table ---------- */

  function apiNote(r) {
    if (r.token && r.token.expired) return '<span class="sub" title="Later days are a gap, not zero usage">Token expired ' + fmt.day(r.token.expires_at) + '</span>';
    return '';
  }
  function plausibility(r) {
    if (!r.api) return dash();
    var flags = r.project.api_flags;
    if (!flags.length) return '<span class="muted">No flags</span>';
    return '<span class="pill pill-warning" title="' + flags.map(function (f) { return apiRules[f]; }).join(', ') + '">' +
      flags.length + (flags.length === 1 ? ' flag' : ' flags') + '</span>';
  }

  function apiTrend(r) {
    var byDay = {};
    r.api_daily.forEach(function (d) { byDay[d.day] = d.requests; });
    return D.rangeDays(state.range).map(function (day) { return byDay[day] === undefined ? null : byDay[day]; });
  }

  function webCells(r) {
    var w = r.web;
    var a = r.api;
    var flags = r.project.api_flags.length;
    return '<td class="num">' + (w ? '<span class="cell-trend">' +
        Charts.spark(r.daily.map(function (d) { return d.pageviews_filtered; }), 'Filtered page views per day, last ' + state.range + ' days') +
        exact(w.pageviews_filtered, fmt.compact(w.pageviews_filtered)) + '</span>' : dash()) + '</td>' +
      '<td>' + (w ? '<span class="cell-trust">' + App.qualityBar(w.pageviews_filtered, w.pageviews_flagged) +
        '<span class="' + (overThreshold(w) ? 'is-over' : '') + '">' + fmt.pct(w.flagged_share) + '</span></span>' : dash()) + '</td>' +
      '<td class="num">' + (w ? exact(w.visitors_filtered, fmt.compact(w.visitors_filtered)) : dash()) + '</td>' +
      '<td class="num">' + (a ? exact(a.requests, fmt.compact(a.requests)) +
        (apiNote(r) || (flags ? '<span class="sub">' + flags + ' plausibility ' + (flags === 1 ? 'flag' : 'flags') + '</span>' : '')) : dash()) + '</td>';
  }
  function apiCells(r) {
    var a = r.api;
    return '<td class="num">' + (a ? '<span class="cell-trend">' +
        Charts.spark(apiTrend(r), 'Requests per day, last ' + state.range + ' days') +
        exact(a.requests, fmt.compact(a.requests)) + '</span>' + apiNote(r) : dash()) + '</td>' +
      '<td class="num">' + (a ? fmt.pct(a.server_error_rate, 2) : dash()) + '</td>' +
      '<td class="num">' + (a ? fmt.ms(a.p95_ms) : dash()) + '</td>' +
      '<td>' + plausibility(r) + '</td>';
  }

  function renderTable() {
    var list = sorted(visible());
    var cols = columns[state.mode];
    var head = '<colgroup>' + (state.comparing ? '<col style="width:40px">' : '') + '<col><col style="width:190px">' +
      (state.mode === 'web' ? [210, 210, 190, 180] : [210, 180, 200, 170]).map(function (w) { return '<col style="width:' + w + 'px">'; }).join('') +
      (state.comparing ? '' : '<col style="width:96px">') + '</colgroup><thead><tr>' + (state.comparing ? '<th class="col-check"><span class="sr-only">Select</span></th>' : '') +
      '<th>Project</th><th>State</th>' + cols.map(function (c) {
        var sort = state.sort === c.key ? ' aria-sort="' + (state.descending ? 'descending' : 'ascending') + '"' : '';
        return '<th class="' + (c.num ? 'num' : '') + '"' + sort + '><button type="button" data-sort="' + c.key + '">' + c.label + '</button></th>';
      }).join('') + (state.comparing ? '' : '<th><span class="sr-only">Details</span></th>') + '</tr></thead>';

    var body = list.map(function (r) {
      var p = r.project;
      var picked = state.compared.indexOf(p.id) >= 0;
      var full = state.compared.length >= MAX_COMPARED && !picked;
      var check = state.comparing
        ? '<td class="col-check"><input type="checkbox" data-compare="' + p.id + '"' + (picked ? ' checked' : '') + (!r.web || full ? ' disabled' : '') +
          ' aria-label="Compare ' + esc(p.name) + '"' + (!r.web ? ' title="No web data to compare"' : '') + '></td>'
        : '';
      var action = state.comparing ? '' : '<td class="num">' + (p.state === 'pending_approval'
        ? '<button class="btn btn-small btn-primary" type="button" data-open="' + p.id + '">Review</button>'
        : '<span class="chev">' + App.icon('chevron') + '</span>') + '</td>';
      return '<tr data-id="' + p.id + '"' + (state.open === p.id || (state.comparing && picked) ? ' class="is-open"' : '') + '>' + check +
        '<td><button class="row-open" type="button" data-open="' + p.id + '">' + App.projectName(p) + '</button><span class="sub">' + esc(p.domain) + '</span></td>' +
        '<td>' + App.statePill(p.state) + '</td>' + (state.mode === 'web' ? webCells(r) : apiCells(r)) + action + '</tr>';
    }).join('');
    if (!list.length) {
      body = '<tr><td colspan="7" class="muted">' + (all.length ? 'No project matches these filters.' : 'No project is enrolled yet.') + '</td></tr>';
    }
    byId('projects').innerHTML = head + '<tbody>' + body + '</tbody>';
    byId('caption').textContent = list.length + ' of ' + all.length + ' projects · Aggregates only; counts under ' + META.small_count_below +
      ' are rounded to the nearest ' + META.small_count_step + '.';
    byId('source').className = 'source muted' + (state.mode === 'api' ? ' source-reported' : '');
    byId('source').textContent = state.mode === 'api' ? 'Reported by the project' : 'Observed by the tracker';
    var active = (state.flagged ? 1 : 0) + (state.api ? 1 : 0);
    byId('filters-button').textContent = 'Filters' + (active ? ' · ' + active : '');
  }

  function renderFinding() {
    var withWeb = all.filter(function (r) { return r.web; });
    var pending = all.filter(function (r) { return r.project.state === 'pending_approval'; }).length;
    var parts = [];
    if (!all.length) parts.push('No project is enrolled yet.');
    if (withWeb.length) {
      var top = withWeb.slice().sort(function (a, b) { return b.web.flagged_share - a.web.flagged_share; })[0];
      parts.push('<span>Highest flagged share: <b>' + esc(top.project.name) + '</b>, ' + fmt.pct(top.web.flagged_share) + '</span>');
    }
    if (pending) parts.push('<span><b>' + pending + '</b> awaiting approval</span>');
    byId('finding').innerHTML = parts.join('');
  }

  /* ---------- compare: an explicit mode, a tray, then its own view ---------- */

  function renderTray() {
    var picked = state.compared.map(find).filter(Boolean);
    var show = state.comparing && state.view === 'list';
    byId('tray').setAttribute('aria-hidden', String(!show));
    byId('tray-text').textContent = picked.length ? picked.length + ' of ' + MAX_COMPARED + ' selected' : 'Select two or three projects to compare';
    byId('tray-picked').innerHTML = picked.map(function (r) { return '<span class="pill">' + esc(r.project.name) + '</span>'; }).join('');
    byId('tray-open').disabled = picked.length < 2;
    byId('tray-open').textContent = picked.length >= 2 ? 'Compare ' + picked.length + ' projects' : 'Compare';
    byId('compare-toggle').setAttribute('aria-pressed', String(state.comparing));
  }

  /* Status classes as one bar at the true ratio, with every share written out. */
  function statusCell(a) {
    var total = a.requests || 1;
    return classSeries.map(function (c) {
      return '<span class="muted">' + c.key + '</span> ' + fmt.pct(a.status_classes[c.key] / total, 2);
    }).join(' <span class="muted">·</span> ') +
      '<span class="stack" role="img" aria-label="Status code classes">' + classSeries.map(function (c) {
        var share = a.status_classes[c.key] / total;
        return share ? '<span style="flex:' + share + ' 1 0;background:' + c.color + '" title="' + c.key + ': ' + fmt.pct(share, 2) + '"></span>' : '';
      }).join('') + '</span>';
  }

  /* Top five named rows and "Other", as shares of the project's own total, so rank reads across. */
  function shareRows(rows) {
    if (!rows || !rows.length) return dash();
    var total = rows.reduce(function (a, r) { return a + r.value; }, 0);
    var named = rows.filter(function (r) { return r.label !== 'Other'; }).slice(0, 5);
    var rest = total - named.reduce(function (a, r) { return a + r.value; }, 0);
    var list = rest > 0 ? named.concat([{ label: 'Other', value: rest }]) : named;
    var max = Math.max.apply(null, list.map(function (r) { return r.value; }));
    return '<div class="bars">' + list.map(function (r) {
      return '<div class="bar-row is-share" title="' + fmt.int(r.value) + '"><span class="bar-label">' + esc(r.label) + '</span>' +
        '<span class="bar-value">' + fmt.pct(total ? r.value / total : 0) + '</span>' +
        '<span class="bar-track"><span class="bar-fill" style="width:' + (max ? r.value / max * 100 : 0) + '%"></span></span></div>';
    }).join('') + '</div>';
  }

  function renderCompareBreakdown(picked) {
    byId('compare-breakdown-label').textContent = BREAKDOWNS[state.compareTab][1];
    picked.forEach(function (r, i) { byId('compare-breakdown-' + i).innerHTML = shareRows(r.breakdowns[state.compareTab]); });
  }

  function renderCompare() {
    var picked = state.compared.map(find).filter(function (r) { return r && r.web; });
    byId('compare-back').innerHTML = App.icon('back') + 'Projects';
    if (picked.length < 2) {
      byId('compare-summary').textContent = 'Same metrics, same period, same scale';
      byId('compare').innerHTML = App.emptyState('Nothing to compare yet', 'Select two or three projects with web data in the projects list.');
      return;
    }
    byId('compare-summary').innerHTML = '<span>' + picked.length + ' projects, last ' + state.range + ' days, one scale</span>' +
      '<span class="legend">' + Charts.legend(series) + '</span>';

    var cells = function (label, cell, bar, first) {
      var max = bar ? Math.max.apply(null, picked.map(function (r) { return bar(r) || 0; })) : 0;
      var cls = first ? ' class="compare-first"' : '';
      return '<div' + (first ? ' class="compare-label compare-first"' : ' class="compare-label"') + '>' + label + '</div>' + picked.map(function (r) {
        var value = cell(r);
        var track = bar && bar(r) ? '<span class="bar-track"><span class="bar-fill" style="width:' + (bar(r) / max * 100) + '%"></span></span>' : '';
        return '<div' + cls + '>' + (value === null ? dash() : value) + track + '</div>';
      }).join('');
    };
    var group = function (label, source) { return '<div class="compare-group">' + label + ' ' + source + '</div>'; };
    var web = function (pick) { return function (r) { return r.web ? pick(r.web, r) : null; }; };
    var api = function (pick) { return function (r) { return r.api ? pick(r.api, r) : null; }; };

    byId('compare').innerHTML = '<div class="compare" style="grid-template-columns:200px repeat(' + picked.length + ', minmax(0, 1fr))">' +
      '<div class="compare-head"></div>' + picked.map(function (r) {
        return '<div class="compare-head"><button class="row-open" type="button" data-open="' + r.project.id + '">' + App.projectName(r.project) + '</button></div>';
      }).join('') +
      '<div class="compare-chart compare-label">Page views per day, raw</div>' + picked.map(function (r, i) {
        return '<div class="compare-chart"><div class="chart" id="multiple-' + i + '"></div></div>';
      }).join('') +
      group('Web', '<span class="source">Observed by the tracker</span>') +
      cells('Page views, filtered', web(function (w) { return '<b>' + fmt.int(w.pageviews_filtered) + '</b> <span class="muted">of ' + fmt.int(w.pageviews_raw) + ' raw</span>'; }), web(function (w) { return w.pageviews_filtered; }), true) +
      cells('Flagged share', web(function (w) {
        return fmt.pct(w.flagged_share) + (w.top_rule ? ' <span class="muted">mostly ' + App.lowerFirst(webRules[w.top_rule]) + '</span>' : '') +
          App.qualityBar(w.pageviews_filtered, w.pageviews_flagged);
      })) +
      cells('Visitors (sum of daily)', web(function (w) { return fmt.int(w.visitors_filtered); }), web(function (w) { return w.visitors_filtered; })) +
      cells('Bounce rate', web(function (w) { return fmt.pct(w.bounce_rate); })) +
      cells('Visit duration', web(function (w) { return fmt.duration(w.avg_visit_seconds); })) +
      '<div class="compare-tabs"><div class="tabs" role="tablist" aria-label="Breakdown" id="compare-tabs">' +
      Object.keys(BREAKDOWNS).map(function (key) {
        return '<button type="button" role="tab" data-tab="' + key + '" aria-selected="' + (key === state.compareTab) + '">' + BREAKDOWNS[key][0] + '</button>';
      }).join('') + '</div></div>' +
      '<div class="compare-label compare-first" id="compare-breakdown-label"></div>' + picked.map(function (r, i) {
        return '<div class="compare-first" id="compare-breakdown-' + i + '"></div>';
      }).join('') +
      group('API', '<span class="source source-reported">Reported by the project</span>') +
      cells('Requests', api(function (a, r) {
        return fmt.int(a.requests) + (r.token && r.token.expired ? ' <span class="pill pill-warning" title="Later days are a gap, not zero usage">Token expired ' + fmt.day(r.token.expires_at) + '</span>' : '');
      }), api(function (a) { return a.requests; }), true) +
      cells('Server errors (5xx)', api(function (a) { return fmt.pct(a.server_error_rate, 2); })) +
      cells('Latency, estimates', api(function (a) {
        return '<span class="muted">p50</span> ' + fmt.ms(a.p50_ms) + ' <span class="muted">· p95</span> ' + fmt.ms(a.p95_ms);
      })) +
      cells('Status codes', api(statusCell)) +
      cells('Plausibility flags', api(function (a, r) {
        return r.project.api_flags.length
          ? '<span class="flags">' + r.project.api_flags.map(function (f) { return '<span class="pill pill-warning">' + apiRules[f] + '</span>'; }).join('') + '</span>'
          : '<span class="muted">None</span>';
      })) + '</div>';

    App.tabs(byId('compare-tabs'), function (tab) { state.compareTab = tab; renderCompareBreakdown(picked); });
    renderCompareBreakdown(picked);

    var max = Math.max.apply(null, picked.map(function (r) {
      return Math.max.apply(null, r.daily.map(function (d) { return d.pageviews_filtered + d.pageviews_flagged; }).concat([0]));
    }));
    picked.forEach(function (r, i) {
      Charts.columns(byId('multiple-' + i), {
        label: r.project.name + ': page views per day, filtered and flagged',
        labels: r.daily.map(function (d) { return fmt.day(d.day); }), height: 180, max: max,
        format: fmt.int, tickFormat: fmt.tick, totalName: 'Raw',
        series: series.map(function (s, index) {
          return Object.assign({}, s, { values: r.daily.map(function (d) { return index ? d.pageviews_flagged : d.pageviews_filtered; }) });
        })
      });
    });
  }

  function showView(view) {
    state.view = view;
    persist();
    byId('view-list').hidden = view !== 'list';
    byId('view-compare').hidden = view !== 'compare';
    (view === 'compare' ? byId('compare-controls') : byId('view-list').querySelector('.title-row')).appendChild(byId('controls'));
    renderTray();
    if (view === 'compare') renderCompare(); else renderTable();
    window.scrollTo(0, 0);
  }

  /* ---------- project detail drawer ---------- */

  function kv(pairs) {
    return '<dl class="kv">' + pairs.map(function (pair) { return '<dt>' + pair[0] + '</dt><dd>' + pair[1] + '</dd>'; }).join('') + '</dl>';
  }

  function drawerWeb(r) {
    var w = r.web;
    if (!w) {
      return '<section class="drawer-section"><h3>Web <span class="source">Observed by the tracker</span></h3>' +
        App.empty(r.project.state === 'active' ? 'No page views in the last ' + state.range + ' days.' : 'Nothing is counted until the project is active.') + '</section>';
    }
    var rules = Object.keys(w.flagged_by_rule).map(function (rule) { return { label: webRules[rule], value: w.flagged_by_rule[rule] }; })
      .sort(function (a, b) { return b.value - a.value; });
    return '<section class="drawer-section"><h3>Web <span class="source">Observed by the tracker</span></h3>' +
      '<div class="drawer-hero"><b>' + fmt.int(w.pageviews_filtered) + '</b><span class="muted">page views, filtered</span>' +
      '<span class="muted">' + App.delta(w.pageviews_filtered, r.web_prior && r.web_prior.pageviews_filtered, { range: state.range, good: 'up' }) + '</span></div>' +
      App.qualityBar(w.pageviews_filtered, w.pageviews_flagged) +
      '<p class="muted"><b style="color:var(--ink);font-weight:600">' + fmt.pct(w.flagged_share) + '</b> flagged · ' + fmt.int(w.pageviews_flagged) + ' of ' + fmt.int(w.pageviews_raw) + ' raw</p>' +
      '<div class="chart" id="drawer-chart" style="margin-top:16px"></div></section>' +

      '<section class="drawer-section"><h3>Flagged page views by rule <span class="muted" style="font-weight:400;font-size:12px">Rule set ' + META.rule_set_version + '</span></h3>' +
      '<div class="bars">' + (w.pageviews_flagged ? App.barRows(rules, { flag: true }) : App.empty('No flagged page views in this period.')) + '</div></section>' +

      '<section class="drawer-section">' + kv([
        ['Visitors (sum of daily), filtered', fmt.int(w.visitors_filtered) + ' <span class="muted">of ' + fmt.int(w.visitors_raw) + ' raw</span>'],
        ['Visits', fmt.int(w.visits)],
        ['Bounce rate', fmt.pct(w.bounce_rate)],
        ['Visit duration', fmt.duration(w.avg_visit_seconds)]
      ]) + '</section>' +

      '<section class="drawer-section"><div class="tabs" role="tablist" aria-label="Breakdown" id="drawer-tabs">' +
      [['referrers', 'Referrers'], ['countries', 'Countries'], ['devices', 'Devices'], ['browsers', 'Browsers']].map(function (tab) {
        return '<button type="button" role="tab" data-tab="' + tab[0] + '" aria-selected="' + (tab[0] === state.drawerTab) + '" aria-controls="drawer-breakdown">' + tab[1] + '</button>';
      }).join('') + '</div><div class="bars" id="drawer-breakdown" role="tabpanel"></div></section>';
  }

  function drawerApi(r) {
    var a = r.api;
    var head = '<section class="drawer-section"><h3>API <span class="source source-reported">Reported by the project</span></h3>';
    var expired = r.token && r.token.expired
      ? '<p class="statusline" style="margin:0 0 8px"><span class="pill pill-warning">Token expired ' + fmt.date(r.token.expires_at) + '</span><span class="muted">Later days are a gap, not zero usage.</span></p>'
      : '';
    if (!a) {
      return head + expired + App.empty(expired ? 'No export in the last ' + state.range + ' days.' : 'This project reports no API telemetry. It is optional.') + '</section>';
    }
    var flags = r.project.api_flags;
    return head + expired +
      '<div class="drawer-hero"><b>' + fmt.int(a.requests) + '</b><span class="muted">requests</span>' +
      '<span class="muted">' + App.delta(a.requests, r.api_prior && r.api_prior.requests, { range: state.range, good: 'up' }) + '</span></div>' +
      '<div style="margin-top:8px">' + kv([
        ['Plausibility flags', flags.length
          ? '<span class="flags" style="justify-content:flex-end">' + flags.map(function (f) { return '<span class="pill pill-warning">' + apiRules[f] + '</span>'; }).join('') + '</span>'
          : '<span class="muted">None</span>'],
        ['Server errors (5xx)', fmt.pct(a.server_error_rate, 2)],
        ['Client errors (4xx)', fmt.pct(a.client_error_rate, 2)],
        ['p50 latency, estimate', fmt.ms(a.p50_ms)],
        ['p95 latency, estimate', fmt.ms(a.p95_ms)],
        ['Status codes', classSeries.map(function (c) { return c.key + ' ' + fmt.pct(a.status_classes[c.key] / (a.requests || 1), 2); }).join(' · ')]
      ]) + '</div></section>';
  }

  function drawerEnrollment(r) {
    var p = r.project;
    var site = p.sites[0];
    var token = r.token;
    return '<section class="drawer-section"><h3>Enrollment</h3>' + kv([
      ['Enrolled', fmt.date(p.enrolled_at)],
      ['Domain proof', site && site.proof ? 'By ' + PROOF_METHODS[site.proof.method] + ', re-checked ' + fmt.date(site.proof.last_checked_at) : '<span class="muted">Not proved</span>'],
      ['First event', site && site.first_event_at ? fmt.date(site.first_event_at) : '<span class="muted">None yet</span>'],
      ['Evidence', p.evidence.length ? p.evidence.map(function (item) {
        return '<span class="badge badge-' + item.status + '">' + esc(item.label) + ' <span class="muted">' + EVIDENCE_STATUS[item.status] + '</span></span>';
      }).join('<br>') : '<span class="muted">None added</span>'],
      ['Ingest token', token
        ? '<span class="mono">' + esc(token.masked.replace(/•+/, '••••')) + '</span> <span class="muted">' + (token.expired ? 'expired ' : 'expires ') + fmt.date(token.expires_at) + '</span>'
        : '<span class="muted">Not issued</span>']
    ]) + '</section>';
  }

  /* Approve only from pending approval; suspend only from active or unverified; remove from any state but removed. */
  function drawerFoot(p, confirming) {
    if (confirming) {
      return '<p style="color:var(--ink)"><b>Remove ' + esc(p.name) + '?</b> ' + REMOVE_NOTE + '</p>' +
        '<button class="btn" type="button" data-foot="cancel">Keep project</button>' +
        '<button class="btn btn-danger" type="button" data-foot="inert">Remove project</button><p id="foot-note" aria-live="polite"></p>';
    }
    var buttons = [];
    if (p.state === 'pending_approval') buttons.push('<button class="btn btn-primary" type="button" data-foot="inert">Approve</button>');
    if (p.state === 'active' || p.state === 'unverified') buttons.push('<button class="btn" type="button" data-foot="inert">Suspend</button>');
    if (p.state !== 'removed') buttons.push('<span class="spacer"></span><button class="btn btn-quiet" type="button" data-foot="remove">Remove…</button>');
    return buttons.join('') + '<p id="foot-note" aria-live="polite"></p>';
  }

  function renderDrawerBreakdown(r) {
    App.barList(byId('drawer-breakdown'), r.breakdowns[state.drawerTab] || [], { limit: 5 });
  }

  function openDrawer(id, from) {
    var r = find(id);
    if (!r) return;
    var p = r.project;
    var drawer = byId('drawer');
    opener = from || document.querySelector('tr[data-id="' + id + '"] .row-open');
    state.open = id;
    drawer.innerHTML =
      '<div class="drawer-head"><div><h2 id="drawer-title">' + App.projectName(p) + '</h2>' +
      '<p><span>' + esc(p.domain) + '</span>' + App.statePill(p.state) + '<span>Last ' + state.range + ' days</span></p></div>' +
      '<button class="icon-btn" type="button" data-foot="close" aria-label="Close details">' + App.icon('close') + '</button></div>' +
      '<div class="drawer-body">' + drawerWeb(r) + drawerApi(r) + drawerEnrollment(r) + '</div>' +
      '<div class="drawer-foot" id="drawer-foot">' + drawerFoot(p, false) + '</div>';
    if (!drawer.open) drawer.showModal();
    Array.prototype.forEach.call(document.querySelectorAll('tr.is-open'), function (row) { row.classList.remove('is-open'); });
    var row = document.querySelector('tr[data-id="' + id + '"]');
    if (row) row.classList.add('is-open');

    if (r.web) {
      Charts.columns(byId('drawer-chart'), {
        label: p.name + ': page views per day, filtered and flagged',
        labels: r.daily.map(function (d) { return fmt.day(d.day); }), height: 140,
        format: fmt.int, tickFormat: fmt.tick, totalName: 'Raw',
        series: series.map(function (s, index) {
          return Object.assign({}, s, { values: r.daily.map(function (d) { return index ? d.pageviews_flagged : d.pageviews_filtered; }) });
        })
      });
      App.tabs(byId('drawer-tabs'), function (tab) { state.drawerTab = tab; renderDrawerBreakdown(r); });
      renderDrawerBreakdown(r);
    }
  }

  function closeDrawer() {
    var drawer = byId('drawer');
    if (drawer.open) drawer.close();
  }

  /* ---------- wiring ---------- */

  function render() {
    all = D.operatorRows(state.range);
    state.compared = state.compared.filter(function (id) { var r = find(id); return r && r.web; });
    byId('stamp').textContent = App.stamp();
    renderFinding();
    renderTray();
    if (state.view === 'compare') renderCompare(); else renderTable();
    if (byId('drawer').open && state.open) openDrawer(state.open, opener);
  }

  document.addEventListener('DOMContentLoaded', function () {
    byId('state-filter').innerHTML = STATE_FILTERS.map(function (s) { return '<option value="' + s[0] + '">' + s[1] + '</option>'; }).join('');
    Array.prototype.forEach.call(byId('mode').children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)); });
    if (state.mode === 'api') state.sort = 'requests';

    byId('search').addEventListener('input', function (event) { state.search = event.target.value; renderTable(); });
    byId('state-filter').addEventListener('change', function (event) { state.stateFilter = event.target.value; renderTable(); });
    byId('f-flagged').addEventListener('change', function (event) { state.flagged = event.target.checked; renderTable(); });
    byId('f-api').addEventListener('change', function (event) { state.api = event.target.checked; renderTable(); });
    byId('threshold').addEventListener('input', function (event) {
      state.threshold = event.target.value === '' ? 0 : Number(event.target.value);
      renderTable();
    });
    byId('f-clear').addEventListener('click', function () {
      state.flagged = state.api = false;
      byId('f-flagged').checked = byId('f-api').checked = false;
      renderTable();
    });
    byId('mode').addEventListener('click', function (event) {
      var button = event.target.closest('button');
      if (!button) return;
      state.mode = button.dataset.mode;
      state.sort = state.mode === 'api' ? 'requests' : 'pageviews';
      state.descending = true;
      Array.prototype.forEach.call(byId('mode').children, function (b) { b.setAttribute('aria-pressed', String(b === button)); });
      persist();
      renderTable();
    });

    byId('projects').addEventListener('click', function (event) {
      var sort = event.target.closest('[data-sort]');
      if (sort) {
        state.descending = state.sort === sort.dataset.sort ? !state.descending : true;
        state.sort = sort.dataset.sort;
        renderTable();
        var again = byId('projects').querySelector('[data-sort="' + state.sort + '"]');
        if (again) again.focus();
        return;
      }
      if (event.target.closest('input')) return;
      var row = event.target.closest('tr[data-id]');
      if (!row) return;
      if (state.comparing) {
        var box = row.querySelector('[data-compare]');
        if (box && !box.disabled) { box.checked = !box.checked; box.dispatchEvent(new Event('change', { bubbles: true })); }
        return;
      }
      openDrawer(row.dataset.id, row.querySelector('.row-open'));
    });
    byId('projects').addEventListener('change', function (event) {
      var id = event.target.dataset.compare;
      if (!id) return;
      if (event.target.checked) state.compared.push(id);
      else state.compared = state.compared.filter(function (x) { return x !== id; });
      persist();
      renderTable();
      renderTray();
      var again = byId('projects').querySelector('[data-compare="' + id + '"]');
      if (again) again.focus();
    });

    byId('compare-toggle').addEventListener('click', function () {
      state.comparing = !state.comparing;
      if (!state.comparing) state.compared = [];
      persist();
      renderTable();
      renderTray();
    });
    byId('tray-cancel').addEventListener('click', function () {
      state.comparing = false;
      state.compared = [];
      persist();
      renderTable();
      renderTray();
      byId('compare-toggle').focus();
    });
    byId('tray-open').addEventListener('click', function () { showView('compare'); byId('compare-back').focus(); });
    byId('compare-back').addEventListener('click', function () { showView('list'); byId('compare-toggle').focus(); });
    byId('compare').addEventListener('click', function (event) {
      var open = event.target.closest('[data-open]');
      if (open) openDrawer(open.dataset.open, open);
    });

    var drawer = byId('drawer');
    drawer.addEventListener('click', function (event) {
      if (event.target === drawer) { closeDrawer(); return; }
      var button = event.target.closest('[data-foot]');
      if (!button) return;
      var r = find(state.open);
      var action = button.dataset.foot;
      if (action === 'close') closeDrawer();
      if (action === 'remove' || action === 'cancel') {
        byId('drawer-foot').innerHTML = drawerFoot(r.project, action === 'remove');
        byId('drawer-foot').querySelector('button').focus();
      }
      if (action === 'inert') byId('foot-note').textContent = App.INERT_NOTE + '. Shown for layout only.';
    });
    drawer.addEventListener('close', function () {
      Array.prototype.forEach.call(document.querySelectorAll('tr.is-open'), function (row) {
        if (!state.comparing) row.classList.remove('is-open');
      });
      state.open = null;
      if (opener && opener.isConnected) opener.focus();
    });

    App.rangeControl(byId('range'), function (range) { state.range = range; render(); });
    if (state.view === 'compare' && state.compared.length >= 2) showView('compare'); else showView('list');

    var requested = null;
    try { requested = new URLSearchParams(window.location.search).get('project'); } catch (error) { /* no query string here */ }
    var linked = requested && D.project(requested);
    if (linked && state.view === 'list') openDrawer(linked.id);
  });
})();
</script>
</body>
</html>
