# Isolated stack for checks 1 and 2. Same pinned images as console/docker-compose.yml.
# Credentials are local to this experiment and are not secrets.
name: us-check-01

x-umami: &umami
  image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 20s

services:
  postgres:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: check
      POSTGRES_PASSWORD: check-local-only
      POSTGRES_DB: check
    ports:
      - "127.0.0.1:55101:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U check -d check"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The Umami under test: client salts are honoured, as the design needs.
  umami:
    <<: *umami
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://check:check-local-only@postgres:5432/check
      APP_SECRET: check-01-local-app-secret
      DISABLE_TELEMETRY: "1"
      ENABLE_CLIENT_SALT: "1"
    ports:
      - "127.0.0.1:33101:3000"

  # Control: the same Umami with its default settings (client salts ignored).
  umami-defaults:
    <<: *umami
    depends_on:
      umami:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://check:check-local-only@postgres:5432/check
      APP_SECRET: check-01-local-app-secret
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:33102:3000"
