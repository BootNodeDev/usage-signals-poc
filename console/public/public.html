<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Public · Pulse</title>
<link rel="preload" href="/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body data-audience="public" data-active="projects">
<div class="frame">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <main class="sheet">

      <div class="title-row">
        <div>
          <h1>Projects</h1>
          <p class="title-sub"><span class="source">Web: observed by the tracker</span><span class="stamp" id="stamp"></span></p>
        </div>
        <div class="controls"><div id="range"></div></div>
      </div>

      <div id="list-message" hidden></div>
      <div class="table-wrap table-narrow"><table class="data" id="projects"></table></div>
      <p class="caption" id="caption"></p>

    </main>
  </div>
</div>

<script src="/data.js"></script>
<script>
(function () {
  'use strict';
  var D = window.LData;
  var byId = function (id) { return document.getElementById(id); };

  function start() {
    var App = window.App;
    var range = null;

    function count(value) {
      return value && value.small
        ? '<span class="muted" title="More than zero and fewer than ' + value.below + '. The exact number is not shown.">&lt;' + value.below + '</span>'
        : App.fmt.int(value);
    }

    function listMessage(title, text, action) {
      byId('list-message').hidden = !title;
      byId('projects').hidden = Boolean(title);
      byId('list-message').innerHTML = title ? App.emptyState(title, text, action) : '';
      byId('caption').textContent = '';
      byId('stamp').textContent = '';
    }

    function paint(rows) {
      if (!rows.length) {
        listMessage('No project is listed yet', 'Projects appear here once they are active.');
        return;
      }
      listMessage('');
      byId('stamp').textContent = App.stamp();
      var sorted = D.sortRows(rows, function (row) { return row.totals.visitors; }, true);
      byId('projects').innerHTML = '<thead><tr><th>Project</th><th class="num" aria-sort="descending">Visitors</th><th class="num">Page views</th></tr></thead><tbody>' +
        sorted.map(function (row) {
          return '<tr><td><b>' + App.projectName(row.project) + '</b></td>' +
            '<td class="num">' + count(row.totals.visitors) + '</td><td class="num">' + count(row.totals.pageviews) + '</td></tr>';
        }).join('') + '</tbody>';
      var below = D.meta().small_counts.below;
      byId('caption').textContent = 'Active projects only, last ' + range + ' days. A visitor counts once a day. Counts of 1 to ' +
        (below - 1) + ' show as <' + below + ', a placeholder threshold.';
    }

    function render(days) {
      range = days;
      listMessage('Loading figures', 'Reading the last ' + days + ' days for every active project.');
      D.loadPublic(days).then(function (rows) {
        if (range === days) paint(rows);
      }, function (error) {
        if (range !== days) return;
        listMessage('Figures are unavailable', App.escapeHtml(error.message || 'The figures could not be read.') + ' Nothing is shown in their place.',
          '<button class="btn btn-primary" type="button" id="retry">Try again</button>');
        byId('retry').addEventListener('click', function () { render(days); });
      });
    }

    App.rangeControl(byId('range'), render);
  }

  D.boot(start);
})();
</script>
</body>
</html>
