# OpenTelemetry Collector Builder manifest for the edge collector of check 05.
# It lists exactly the components collector.yaml uses, at the versions the contrib distribution
# 0.165.0 pins. Dockerfile.edge builds it, and run.mjs runs the check against that build.
# run.mjs fails when this list and collector.yaml disagree, and when the binary reports other
# components than these.
dist:
  name: usage-signals-edge
  description: Usage Signals edge collector, upstream components only
  version: 0.165.0
  output_path: ./_build

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/oidcauthextension v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.165.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.165.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.165.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.165.0
  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.165.0

# A collector resolves a configuration value without a scheme with the env provider, and does
# not start when that provider is missing, so it is listed although collector.yaml reads no
# environment variable.
providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.71.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.71.0
