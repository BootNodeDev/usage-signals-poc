# Isolated stack for check 07. The network has no route to the outside. Nothing is published
# on the host. Start it through run.mjs, which supplies the scratch directory.
name: us-check-07

x-node: &node
  image: node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53

x-endpoint: &endpoint
  build: ./endpoint
  cap_add: [NET_ADMIN]
  volumes:
    - ${CHECK_SCRATCH:?run through run.mjs}:/scratch
  healthcheck:
    test: ["CMD", "test", "-f", "/tmp/ready"]
    interval: 1s
    timeout: 2s
    retries: 30

x-chromium: &chromium
  image: chromedp/headless-shell:159.0.8154.13@sha256:381353d3530ab9d579d2fe8b9c0f4519c995617f5a71daf6bb649e2d12005bd9
  volumes:
    - ./resolv.conf:/etc/resolv.conf:ro
  depends_on: [dns]

services:
  # The location that fails. Each failure mode is a port; see endpoint/endpoint.mjs.
  endpoint-a:
    <<: *endpoint
    environment: { NAME: a, ROLE: failing }
    networks: { ingest: { ipv4_address: 10.207.7.10 } }

  # The location that stays up. CHECK_NEGATIVE=1 starts it dead.
  endpoint-b:
    <<: *endpoint
    environment: { NAME: b, ROLE: "${CHECK_B_ROLE:-live}" }
    networks: { ingest: { ipv4_address: 10.207.7.11 } }

  dns:
    <<: *node
    command: ["node", "/app/dns.mjs"]
    environment: { ADDR_FAILING: 10.207.7.10, ADDR_LIVE: 10.207.7.11, ADDR_SELF: 10.207.7.53 }
    volumes:
      - ./dns.mjs:/app/dns.mjs:ro
      - ./clients/probe.mjs:/app/probe.mjs:ro
      - ../../console/public/s/3.5.0-ac07551a/t.js:/tracker/t.js:ro
      - ${CHECK_SCRATCH:?run through run.mjs}:/scratch
    networks: { ingest: { ipv4_address: 10.207.7.53 } }

  # Chromium whose pages stay open until the request settles.
  chromium:
    <<: *chromium
    networks: { ingest: { ipv4_address: 10.207.7.20 } }

  # Chromium whose pages are closed as soon as the request has been issued.
  chromium-close:
    <<: *chromium
    networks: { ingest: { ipv4_address: 10.207.7.25 } }

  # The Node.js SDK. Also drives both Chromium containers over the DevTools protocol and
  # posts the test batch to the collector; none of that traffic goes to an ingest port.
  client-node:
    build: ./clients/node
    command: ["sleep", "infinity"]
    init: true
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro
      - ./clients:/check:ro
      - ${CHECK_SCRATCH:?run through run.mjs}:/scratch:ro
    depends_on: [dns]
    networks: { ingest: { ipv4_address: 10.207.7.21 } }

  client-python:
    build: ./clients/python
    command: ["sleep", "infinity"]
    init: true
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro
    depends_on: [dns]
    networks: { ingest: { ipv4_address: 10.207.7.22 } }

  client-go:
    build: ./clients/go
    command: ["sleep", "infinity"]
    init: true
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro
    depends_on: [dns]
    networks: { ingest: { ipv4_address: 10.207.7.23 } }

  # The upstream contrib distribution, unmodified. run.mjs writes its configuration and
  # starts it once per case.
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/scratch/collector-active.yaml"]
    profiles: [collector]
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro
      - ${CHECK_SCRATCH:?run through run.mjs}:/scratch:ro
    networks: { ingest: { ipv4_address: 10.207.7.24 } }

networks:
  ingest:
    internal: true
    ipam:
      config:
        - subnet: 10.207.7.0/24
