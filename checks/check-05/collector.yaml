# Edge collector for check 05. Upstream components only; builder-manifest.yaml lists them.
# run.mjs copies this file to the scratch directory, and derives its negative controls from it
# by removing one named processor or block at a time, so the names below are load-bearing.

extensions:
  # Verifies each tenant's signed token (a JWT) against a local key file. public_keys_file
  # switches OpenID discovery off, so the issuer address is an identifier and is never called.
  oidc/tenant_tokens:
    providers:
      - issuer_url: https://ingest.usage-signals.invalid/tokens
        audience: usage-signals-ingest
        public_keys_file: /scratch/jwks.json

  file_storage/queue:
    directory: /scratch/queue
    fsync: true

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 1048576
        auth:
          authenticator: oidc/tenant_tokens

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 80

  # Whatever the client sent under a name the edge stamps is removed first. A request can
  # carry the same key more than once, and delete_matching_keys removes every occurrence;
  # delete_key and the resource processor's delete action remove only the first one.
  transform/strip:
    error_mode: propagate
    metric_statements:
      - delete_matching_keys(resource.attributes, "^(tenant[.]id|usage_signals[.].*)$$")

  # The values of the verified token. insert cannot keep a client value: none is left.
  resource/tenant:
    attributes:
      - { key: tenant.id, action: insert, from_context: auth.claims.tenant_id }
      - { key: usage_signals.token_id, action: insert, from_context: auth.claims.jti }

  transform/receipt:
    error_mode: propagate
    metric_statements:
      - set(resource.attributes["usage_signals.received_at_unix_nano"], UnixNano(Now()))

  # Any condition that holds drops the metric. A wrong unit is not dropped here (round two):
  # it goes on to the writer, which refuses it and records the refusal for the tenant.
  filter/http_server_only:
    error_mode: propagate
    metric_conditions:
      - resource.attributes["tenant.id"] == nil
      - metric.type != METRIC_DATA_TYPE_HISTOGRAM
      - metric.name != "http.server.request.duration" and metric.name != "http.server.duration"

  # The older convention: milliseconds and the old attribute names. The older name with
  # another unit is renamed first, so that it is not rescaled and the writer refuses it.
  transform/legacy:
    error_mode: propagate
    metric_statements:
      - context: metric
        statements:
          - set(metric.name, "http.server.duration, unit not ms") where metric.name == "http.server.duration" and metric.unit != "ms"
          - scale_metric(0.001, "s") where metric.name == "http.server.duration"
          - set(metric.name, "http.server.request.duration") where metric.name == "http.server.duration"
      - context: datapoint
        statements:
          - set(datapoint.attributes["http.request.method"], datapoint.attributes["http.method"]) where datapoint.attributes["http.request.method"] == nil and datapoint.attributes["http.method"] != nil
          - set(datapoint.attributes["http.response.status_code"], datapoint.attributes["http.status_code"]) where datapoint.attributes["http.response.status_code"] == nil and datapoint.attributes["http.status_code"] != nil
          - set(datapoint.attributes["http.route"], datapoint.attributes["http.target"]) where datapoint.attributes["http.route"] == nil and datapoint.attributes["http.target"] != nil

  # The allowlist is built, not filtered: each kept value is read once into the statement
  # cache, the attribute map is emptied, and the value is written back. A key that was sent
  # several times therefore ends as one key with the value every later statement works on,
  # and a route or method that is not a string, or a status code that is not an integer, is
  # not kept at all. Exemplars, the metric description and metadata, the scope and both
  # schema URLs are cleared, so that none of them reaches the disk queue.
  transform/allowlist:
    error_mode: propagate
    metric_statements:
      - context: resource
        statements:
          - set(resource.cache["tenant"], resource.attributes["tenant.id"])
          - set(resource.cache["token"], resource.attributes["usage_signals.token_id"])
          - set(resource.cache["received"], resource.attributes["usage_signals.received_at_unix_nano"])
          - set(resource.cache["service"], resource.attributes["service.name"]) where IsString(resource.attributes["service.name"])
          - set(resource.cache["instance"], resource.attributes["service.instance.id"]) where IsString(resource.attributes["service.instance.id"])
          - keep_keys(resource.attributes, [])
          - set(resource.attributes["tenant.id"], resource.cache["tenant"]) where resource.cache["tenant"] != nil
          - set(resource.attributes["usage_signals.token_id"], resource.cache["token"]) where resource.cache["token"] != nil
          - set(resource.attributes["usage_signals.received_at_unix_nano"], resource.cache["received"]) where resource.cache["received"] != nil
          - set(resource.attributes["service.name"], resource.cache["service"]) where resource.cache["service"] != nil
          - set(resource.attributes["service.instance.id"], resource.cache["instance"]) where resource.cache["instance"] != nil
          - set(resource.schema_url, "")
      - context: scope
        statements:
          - set(scope.name, "")
          - set(scope.version, "")
          - keep_keys(scope.attributes, [])
          - set(scope.schema_url, "")
      - context: metric
        statements:
          - set(metric.description, "")
          - keep_keys(metric.metadata, [])
      - context: datapoint
        statements:
          - set(datapoint.cache["route"], datapoint.attributes["http.route"]) where IsString(datapoint.attributes["http.route"])
          - set(datapoint.cache["method"], datapoint.attributes["http.request.method"]) where IsString(datapoint.attributes["http.request.method"])
          - set(datapoint.cache["status"], datapoint.attributes["http.response.status_code"]) where IsInt(datapoint.attributes["http.response.status_code"])
          - keep_keys(datapoint.attributes, [])
          - set(datapoint.attributes["http.route"], datapoint.cache["route"]) where datapoint.cache["route"] != nil
          - set(datapoint.attributes["http.request.method"], datapoint.cache["method"]) where datapoint.cache["method"] != nil
          - set(datapoint.attributes["http.response.status_code"], datapoint.cache["status"]) where datapoint.cache["status"] != nil
          - set(datapoint.exemplars, nil)

  # Path rules, RE2 syntax. RE2 has no lookaround, so a rule cannot say "ends at a segment
  # boundary" without consuming the slash that the next segment needs. Every slash is therefore
  # doubled and the route is wrapped in two more: each segment then sits between two slashes of
  # its own, every rule is the plain form /<pattern>/, and the last two statements undo it.
  # "$$" is the configuration file's escape for a literal "$".
  transform/path_rules:
    error_mode: propagate
    metric_statements:
      - set(datapoint.attributes["http.route"], "(too_long)") where datapoint.attributes["http.route"] != nil and Len(datapoint.attributes["http.route"]) > 1024
      # Everything from the first "?", "#" or control character on, newlines included.
      - replace_pattern(datapoint.attributes["http.route"], "(?s)[?#[:cntrl:]].*$$", "")
      # The scheme and host of an absolute URL.
      - replace_pattern(datapoint.attributes["http.route"], "^[A-Za-z][A-Za-z0-9+.-]*://[^/]*", "")
      - replace_pattern(datapoint.attributes["http.route"], "/", "//")
      - set(datapoint.attributes["http.route"], Concat(["/", datapoint.attributes["http.route"], "/"], "")) where datapoint.attributes["http.route"] != nil
      # Numeric IDs, then Horizon paging tokens.
      - replace_pattern(datapoint.attributes["http.route"], "/[0-9]+/", "/{id}/")
      - replace_pattern(datapoint.attributes["http.route"], "/[0-9]{10,}-[0-9]+/", "/{paging_token}/")
      # UUIDs.
      - replace_pattern(datapoint.attributes["http.route"], "/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/", "/{uuid}/")
      # Hex runs of 24 digits or more, with or without 0x.
      - replace_pattern(datapoint.attributes["http.route"], "/(?:0[xX])?[0-9a-fA-F]{24,}/", "/{hash}/")
      # E-mail addresses and JWTs.
      - replace_pattern(datapoint.attributes["http.route"], "/[^/@]+@[^/@]+[.][^/@]+/", "/{email}/")
      - replace_pattern(datapoint.attributes["http.route"], "/eyJ[A-Za-z0-9_-]+[.][A-Za-z0-9_-]+[.][A-Za-z0-9_-]*/", "/{jwt}/")
      # SEP-23 strkeys as whole segments. The second character is A to D because the low
      # three bits of the version byte are zero. The secret seed comes first.
      - replace_pattern(datapoint.attributes["http.route"], "/S[A-D][A-Z2-7]{54}/", "/{redacted}/")
      - replace_pattern(datapoint.attributes["http.route"], "/G[A-D][A-Z2-7]{54}/", "/{account}/")
      - replace_pattern(datapoint.attributes["http.route"], "/C[A-D][A-Z2-7]{54}/", "/{contract}/")
      - replace_pattern(datapoint.attributes["http.route"], "/M[A-D][A-Z2-7]{67}/", "/{muxed_account}/")
      - replace_pattern(datapoint.attributes["http.route"], "/(?:[TXL][A-D][A-Z2-7]{54}|B[A-D][A-Z2-7]{56}|W[A-D][A-Z2-7]{67}|P[A-D][A-Z2-7]{67,163})/", "/{strkey}/")
      # An account, contract or muxed address next to other text in its segment, as in
      # USDC:G... or G....json. Only the address is replaced.
      - replace_pattern(datapoint.attributes["http.route"], "/([^/]*[^A-Z2-7/])?G[A-D][A-Z2-7]{54}([^A-Z2-7/][^/]*)?/", "/$${1}{account}$${2}/")
      - replace_pattern(datapoint.attributes["http.route"], "/([^/]*[^A-Z2-7/])?C[A-D][A-Z2-7]{54}([^A-Z2-7/][^/]*)?/", "/$${1}{contract}$${2}/")
      - replace_pattern(datapoint.attributes["http.route"], "/([^/]*[^A-Z2-7/])?M[A-D][A-Z2-7]{67}([^A-Z2-7/][^/]*)?/", "/$${1}{muxed_account}$${2}/")
      # Anything that still looks like a secret seed, in either case, anywhere in a segment,
      # down to 52 of its 56 characters: the whole segment is redacted.
      - replace_pattern(datapoint.attributes["http.route"], "/[^/]*(?i:S[A-D][A-Z2-7]{50,})[^/]*/", "/{redacted}/")
      # Round two: two rules that know no identifier shape, placed last so that they also
      # bound what the rules above wrote. A segment that holds a character outside printable
      # ASCII is replaced, then a segment longer than 36 characters. After them every segment
      # of every route is at most 36 printable ASCII characters, whatever was sent.
      - replace_pattern(datapoint.attributes["http.route"], "/[^/]*[^ -~][^/]*/", "/{non_ascii}/")
      - replace_pattern(datapoint.attributes["http.route"], "/[^/]{37,}/", "/{long}/")
      # Undo the doubling, then drop trailing slashes except on the root.
      - replace_pattern(datapoint.attributes["http.route"], "/{2,}", "/")
      - replace_pattern(datapoint.attributes["http.route"], "(.)/$$", "$$1")

  transform/unmatched:
    error_mode: propagate
    metric_statements:
      - set(datapoint.attributes["http.route"], "(unmatched)") where datapoint.attributes["http.route"] == nil

  # With no attribute list, only points whose attribute sets are already equal are combined.
  transform/merge:
    error_mode: propagate
    metric_statements:
      - aggregate_on_attributes("sum") where metric.type == METRIC_DATA_TYPE_HISTOGRAM

exporters:
  # initial_interval and max_interval are shortened so the experiment finishes quickly.
  # max_elapsed_time 0 means a batch is retried until it is delivered.
  otlp_http/writer:
    endpoint: http://writer:43195
    encoding: json
    compression: none
    retry_on_failure:
      enabled: true
      initial_interval: 500ms
      max_interval: 2s
      max_elapsed_time: 0
    sending_queue:
      enabled: true
      storage: file_storage/queue
      queue_size: 10000

  nop:

service:
  extensions: [oidc/tenant_tokens, file_storage/queue]
  telemetry:
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/strip, resource/tenant, transform/receipt, filter/http_server_only, transform/legacy, transform/allowlist, transform/path_rules, transform/unmatched, transform/merge]
      exporters: [otlp_http/writer]
    # BEGIN discard pipelines
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [nop]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [nop]
    # END discard pipelines
