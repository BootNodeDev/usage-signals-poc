# Isolated stack for check 05. Credentials are local values, not secrets.
# run.mjs sets CHECK_SCRATCH (a mktemp directory holding jwks.json, the collector configuration
# in use, the disk queue and the writers' capture logs) and CHECK_EDGE_IMAGE. No host port is
# fixed: Docker picks free ones and harness.mjs asks which.
name: us-check-05-r2

services:
  postgres:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc-local-only
      POSTGRES_DB: poc
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The edge collector. By default the image harness.mjs builds from Dockerfile.edge, which is
  # the OpenTelemetry Collector Builder run on builder-manifest.yaml. CHECK_EDGE=contrib runs
  # the unmodified contrib distribution instead, for comparison.
  collector:
    image: ${CHECK_EDGE_IMAGE:?run through run.mjs}
    command: ["--config=/scratch/collector-active.yaml"]
    ports:
      - "127.0.0.1::4318"
    volumes:
      - ${CHECK_SCRATCH:?run through run.mjs}:/scratch

  writer:
    image: node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    working_dir: /app
    command: ["node", "writer.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://poc:poc-local-only@postgres:5432/poc
      WRITER_PORT: "43195"
      WRITER_SCRATCH: /scratch
      WRITER_CAPTURE: writer-capture.jsonl
    ports:
      - "127.0.0.1::43195"
    volumes:
      - .:/app:ro
      - ${CHECK_SCRATCH:?run through run.mjs}:/scratch

  # A second writer process on the same database, for the case of one batch reaching two
  # writers at the same moment. The collector does not export to it.
  writer-2:
    image: node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    working_dir: /app
    command: ["node", "writer.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://poc:poc-local-only@postgres:5432/poc
      WRITER_PORT: "43195"
      WRITER_SCRATCH: /scratch
      WRITER_CAPTURE: writer-2-capture.jsonl
    ports:
      - "127.0.0.1::43195"
    volumes:
      - .:/app:ro
      - ${CHECK_SCRATCH:?run through run.mjs}:/scratch

  # A tenant's own Collector, the route the design recommends: cumulative to delta, then the
  # edge. It is the tenant's software, so it stays the contrib distribution. run.mjs writes its
  # configuration and starts it for one case only.
  tenant-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/scratch/tenant-collector.yaml"]
    ports:
      - "127.0.0.1::4318"
    volumes:
      - ${CHECK_SCRATCH:?run through run.mjs}:/scratch

volumes:
  pgdata:
