<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access · Operator · Usage Signals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-audience="operator" data-active="access">
<div class="frame">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <main class="sheet">
      <div class="title-row">
        <div>
          <h1>Access</h1>
          <p class="title-sub">Who can use the operator console and the metrics API</p>
        </div>
      </div>
      <div id="content"></div>
    </main>
  </div>
</div>

<script src="/data.js"></script>
<script>
(function () {
  'use strict';
  var D = window.LData;
  var content = document.getElementById('content');

  function message(title, text, action) {
    content.innerHTML = '<div class="empty-state"><h2>' + title + '</h2><p>' + text + '</p>' + (action || '') + '</div>';
  }

  var SECTIONS = [
    ['Operators', 'No operator accounts exist. Sign-in with an allowlisted account and a one-time code is planned; today anyone with this address sees the operator console.'],
    ['Metrics API keys', 'No keys exist. The metrics API and its keys are planned.'],
    ['Enrollment mode', 'Projects cannot enroll. The projects listed were seeded when this prototype was deployed.'],
    ['Audit log', 'No operator action exists, so nothing is logged.']
  ];

  function start() {
    content.innerHTML = SECTIONS.map(function (section) {
      return '<section class="block"><div class="block-head"><h2>' + section[0] + '</h2><span class="pill">' + window.App.NOT_IN_PROTOTYPE + '</span></div>' +
        '<p class="muted">' + section[1] + '</p></section>';
    }).join('');
  }

  message('Loading', '');
  D.boot(start);
})();
</script>
</body>
</html>
