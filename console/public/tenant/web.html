<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web analytics · Pulse</title>
<link rel="preload" href="/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script>
  window.va = window.va || function () { window.vaq = window.vaq || []; window.vaq.push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body data-audience="tenant" data-active="web">
<div class="frame">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <main class="sheet">

      <div class="title-row">
        <div>
          <h1>Web analytics</h1>
          <p class="title-sub"><span class="source">Observed by the tracker</span><span class="stamp" id="stamp"></span></p>
        </div>
        <div class="controls"><div id="range"></div></div>
      </div>

      <div id="content">
        <section class="headline" aria-label="Headline figures" id="headline"></section>

        <div class="cols">
          <section class="block" aria-labelledby="chart-title">
            <div class="block-head">
              <h2 id="chart-title">Page views per day</h2>
              <div class="block-tools">
                <div class="legend" id="legend"></div>
                <button class="btn btn-small" type="button" id="toggle">View table</button>
                <button class="btn btn-small" type="button" id="csv">Download CSV</button>
              </div>
            </div>
            <div class="chart" id="chart"></div>
            <div class="table-view" id="table" hidden></div>
          </section>

          <section class="field" aria-label="Breakdown">
            <div class="tabs" role="tablist" aria-label="Breakdown" id="tabs">
              <button type="button" role="tab" data-tab="referrers" aria-selected="true" aria-controls="breakdown">Referrers</button>
              <button type="button" role="tab" data-tab="countries" aria-selected="false" aria-controls="breakdown">Countries</button>
              <button type="button" role="tab" data-tab="devices" aria-selected="false" aria-controls="breakdown">Devices</button>
              <button type="button" role="tab" data-tab="browsers" aria-selected="false" aria-controls="breakdown">Browsers</button>
            </div>
            <p class="field-caption" id="breakdown-caption"></p>
            <div class="bars" id="breakdown" role="tabpanel"></div>
          </section>
        </div>

        <div class="cols">
          <section class="block" aria-labelledby="rules-title">
            <div class="block-head"><h2 id="rules-title">Flagged page views by rule</h2></div>
            <div class="bars" id="rules"></div>
            <p class="caption" id="rules-note"></p>
          </section>
        </div>
      </div>
      <div id="empty" hidden></div>

    </main>
  </div>
</div>

<script type="module" src="/data.js"></script>
<script type="module" src="/charts.js"></script>
<script type="module">
  var D = window.LData;
  var byId = (id) => document.getElementById(id);

  function message(title, text, action) {
    byId('content').hidden = true;
    byId('empty').hidden = false;
    byId('empty').innerHTML = '<div class="empty-state"><h2>' + title + '</h2><p>' + text + '</p>' + (action || '') + '</div>';
  }

  /* Shared by the three tenant pages: what to show when the address names no project. */
  function projectMissing(message) {
    var status = D.status();
    if (status.state === 'error') {
      message('The project could not be read', App.escapeHtml(status.error || '') + ' Nothing is shown in its place.',
        '<button class="btn btn-primary" type="button" id="retry">Try again</button>');
      document.getElementById('retry').addEventListener('click', () => { window.location.reload(); });
    } else {
      message('Project not found', 'No project is registered at this address. The console is opened from a project\'s own address.');
    }
  }

  function start() {
    var App = window.App;
    var fmt = App.fmt;
    var project = App.tenant;
    var state = { range: 30, tab: App.store.get('web-tab') || 'referrers' };
    var series = [
      { name: 'Counted', color: 'var(--data-filtered)' },
      { name: 'Flagged', color: 'var(--data-flagged)', hatch: true }
    ];
    var dimensions = {
      referrers: 'Visitors in the period by referring host',
      countries: 'Visitors in the period by country',
      devices: 'Visitors in the period by device class',
      browsers: 'Visitors in the period by browser'
    };
    var retry = '<button class="btn btn-primary" type="button" id="retry">Try again</button>';

    function figure(label, value, note) {
      return '<div class="figure"><div class="figure-label">' + label + '</div>' +
        '<div class="figure-value">' + value + '</div><div class="figure-note">' + note + '</div></div>';
    }

    function renderHeadline(t, prior, range) {
      byId('headline').innerHTML =
        '<div class="figure hero"><div class="figure-label">' +
        App.info('pageviews', 'Page views', '<p>Every page view the tracker reported, minus the flagged ones. Raw is both together.</p>' +
          '<p>A page view is flagged when it matches a rule. It is stored and shown apart, never dropped.</p>') + '</div>' +
        '<div class="figure-row"><div class="figure-value">' + fmt.int(t.pageviews) + '</div>' +
        '<div class="figure-note">' + App.delta(t.pageviews, prior && prior.pageviews, { range: range, good: 'up' }) + '</div></div>' +
        '<div class="flagline">' + App.qualityBar(t.pageviews, t.flagged) +
        '<span><b>' + fmt.int(t.flagged) + ' flagged</b> <span class="muted">of ' + fmt.int(t.pageviews + t.flagged) + ' raw</span></span></div></div>' +

        figure(App.info('visitors', 'Visitors (sum of daily)', '<p>A visitor is counted once per day and never linked across days, so a multi-day figure is the sum of daily visitors.</p>'),
          fmt.int(t.visitors), 'Flagged traffic left out') +
        figure(App.info('duration', 'Visit duration', '<p>A visit is one visitor\'s activity within one clock hour.</p><p>Average over <b>' + fmt.int(t.visits) + '</b> visits.</p>'),
          fmt.duration(t.avg_visit_seconds), App.delta(t.avg_visit_seconds, prior && prior.avg_visit_seconds, { range: range, good: 'up' })) +
        figure(App.info('bounce', 'Bounce rate', '<p>A bounce is a visit with one page view and no custom event.</p><p><b>' + fmt.int(t.bounces) + '</b> of <b>' + fmt.int(t.visits) + '</b> visits.</p>'),
          fmt.pct(t.bounce_rate), App.delta(t.bounce_rate, prior && prior.bounce_rate, { range: range, good: 'down', points: true }));
    }

    function renderBreakdown() {
      byId('breakdown-caption').textContent = dimensions[state.tab];
      App.barList(byId('breakdown'), D.breakdown(state.tab));
    }

    function renderRules(byRule, flagged) {
      var limit = D.meta().max_agents_per_address;
      byId('rules-title').innerHTML = App.info('rules', 'Flagged page views by rule',
        '<p><b>Known bot</b>: the User-Agent names a crawler, a script or a headless browser.</p>' +
        '<p><b>No browser fetch headers</b>: the request lacks the Sec-Fetch headers that current browsers send.</p>' +
        '<p><b>Many User-Agents on one network</b>: the address, with its last part removed, showed more than ' + limit + ' User-Agents today (UTC).</p>');
      byId('rules-note').textContent = 'Flagged page views are stored and shown apart, never dropped. One page view can match more than one rule. ' +
        'This prototype has three rules, and its limit of ' + limit + ' User-Agents is a placeholder.';
      App.barList(byId('rules'), byRule, { flag: true, total: flagged });
    }

    function renderEmpty(range) {
      var waiting = {
        pending_verification: 'is waiting for its domain proof',
        pending_approval: 'is waiting for an operator to approve it',
        suspended: 'is suspended', removed: 'has been removed'
      }[project.state];
      if (waiting) {
        message('Nothing is counted yet', App.escapeHtml(project.name) + ' ' + waiting + '. Page views appear here once the project is active.');
      } else {
        message('No page views in the last ' + range + ' days', 'Page views appear once the tracking snippet is installed on ' + App.escapeHtml(project.domain) + '.');
      }
    }

    function paint(range) {
      var result = D.web(range);
      var t = result.totals;
      var rows = result.rows;
      byId('stamp').textContent = App.stamp();
      if (!t) { renderEmpty(range); return; }
      byId('content').hidden = false;
      byId('empty').hidden = true;

      renderHeadline(t, result.prior, range);
      byId('legend').innerHTML = Charts.legend(series);
      series[0].values = rows.map((r) => r.pageviews);
      series[1].values = rows.map((r) => r.flagged);
      Charts.columns(byId('chart'), {
        label: 'Page views per day, counted and flagged, last ' + range + ' days',
        labels: rows.map((r) => fmt.day(r.day)),
        series: series, height: App.plotHeight(500, 260, 460), format: fmt.int, tickFormat: fmt.tick, totalName: 'Raw',
        annotations: [], emptyText: 'No page views in this period.'
      });
      App.dataTable(byId('table'), ['Day', 'Page views', 'Flagged', 'Raw', 'Visitors'], rows.slice().reverse().map((r) => [fmt.date(r.day), fmt.int(r.pageviews), fmt.int(r.flagged), fmt.int(r.pageviews + r.flagged), fmt.int(r.visitors)]));
      renderBreakdown();
      renderRules(result.byRule, t.flagged);
    }

    function downloadDays() {
      var rows = D.web(state.range).rows;
      App.downloadCsv(project.slug + '-web-' + rows[0].day + '-to-' + rows[rows.length - 1].day + '.csv', ['Day', 'Page views', 'Visitors'],
        rows.map((r) => [r.day, r.pageviews, r.visitors]));
    }

    function render(range) {
      state.range = range;
      message('Loading figures', 'Reading the last ' + range + ' days for ' + App.escapeHtml(project.domain) + '.');
      D.loadWeb(range).then(() => {
        if (state.range === range) paint(range);
      }, (error) => {
        if (state.range !== range) return;
        message('Figures are unavailable', App.escapeHtml(error.message || 'The figures could not be read.') +
          ' Nothing is shown in their place.', retry);
        byId('retry').addEventListener('click', () => { render(range); });
      });
    }

    if (!project) { projectMissing(message); return; }
    if (!dimensions[state.tab]) state.tab = 'referrers';
    Array.prototype.forEach.call(byId('tabs').children, (tab) => {
      tab.setAttribute('aria-selected', String(tab.dataset.tab === state.tab));
    });
    App.tabs(byId('tabs'), (tab) => {
      state.tab = tab;
      App.store.set('web-tab', tab);
      if (D.web(state.range).totals) renderBreakdown();
    });
    App.viewToggle(byId('toggle'), byId('chart'), byId('table'));
    byId('csv').addEventListener('click', downloadDays);
    App.rangeControl(byId('range'), render);
  }

  message('Loading', 'Reading the project.');
  D.boot(start);
</script>
</body>
</html>
